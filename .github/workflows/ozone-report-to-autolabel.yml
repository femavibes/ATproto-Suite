name: Publish ozone-report-to-autolabel

# Keeps ghcr.io/femavibes/ozone-report-to-autolabel in sync when suite sources change.
# (Nested workflows under ozone/.../.github do not run in this monorepo.)

on:
  push:
    branches: [main]
    paths:
      - "ozone/ozone-report-to-autolabel/**"
      - ".github/workflows/ozone-report-to-autolabel.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: femavibes/ozone-report-to-autolabel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./ozone/ozone-report-to-autolabel
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
