# label·ops — config UI + three workers (all from GHCR)
#
#   docker compose up -d
#   open http://localhost:8787  → configure in the UI
#
# Saves recreate workers automatically via docker.sock (no DOCKER_GID needed).

services:
  config-ui:
    image: ghcr.io/femavibes/label-ops-config-ui:latest
    build: ./config-ui
    ports:
      - "${CONFIG_UI_PORT:-8787}:8787"
    env_file:
      - path: .env
        required: false
    environment:
      LABEL_OPS_CONFIG: /data/config/labels.json
      LABEL_OPS_OVERLAYS: /data/config/overlays
      LABEL_OPS_ENV: /data/stack/.env
      LABEL_OPS_COMPOSE_DIR: /data/stack
      LABEL_OPS_AUTO_RELOAD: ${LABEL_OPS_AUTO_RELOAD:-1}
      COMPOSE_PROJECT_NAME: label-ops
      CONFIG_UI_PORT: "8787"
      LABELER_DID: ${LABELER_DID:-}
      LABEL_SYNC_INTERVAL_MINUTES: ${LABEL_SYNC_INTERVAL_MINUTES:-15}
      CONFIG_UI_PASSWORD: ${CONFIG_UI_PASSWORD:-}
    volumes:
      - ./config:/data/config
      - .:/data/stack
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  label-watcher:
    image: ghcr.io/femavibes/bsky-label-watcher:latest
    ports:
      - "3501:3500"
    env_file:
      - path: .env
        required: false
      - path: ./config/overlays/label-watcher.env
        required: false
    environment:
      LABELER_DID: ${LABELER_DID:-}
      LABELER_APP_PASSWORD: ${LABELER_APP_PASSWORD:-}
      LABELER_SOCKET_URL: ${LABELER_SOCKET_URL:-}
      LABELER_CURSOR_FILEPATH: /var/data/cursor.txt
      LOG_FILEPATH: /var/data/log.txt
      BSKY_SERVICE: ${BSKY_SERVICE:-https://bsky.social}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    volumes:
      - ./data/label-watcher:/var/data
    restart: unless-stopped

  graze-post-remover:
    image: ghcr.io/femavibes/graze-post-remover:latest
    env_file:
      - path: .env
        required: false
      - path: ./config/overlays/graze-post-remover.env
        required: false
    environment:
      LABELER_SOCKET_URL: ${LABELER_SOCKET_URL:-}
      LABELER_DID: ${LABELER_DID:-}
      OZONE_URL: ${OZONE_URL:-}
      BSKY_HANDLE: ${BSKY_HANDLE:-${LABELER_HANDLE:-}}
      BSKY_APP_PASSWORD: ${BSKY_APP_PASSWORD:-${LABELER_APP_PASSWORD:-}}
      CURSOR_FILEPATH: /app/data/cursor.txt
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OZONE_POLLING_SECONDS: ${OZONE_POLLING_SECONDS:-30}
    volumes:
      - ./data/graze-remover:/app/data
    restart: unless-stopped

  autolabel:
    image: ghcr.io/femavibes/ozone-report-to-autolabel:latest
    env_file:
      - path: .env
        required: false
      - path: ./config/overlays/autolabel.env
        required: false
    environment:
      BSKY_LABELER_USERNAME: ${LABELER_HANDLE:-}
      BSKY_LABELER_PASSWORD: ${LABELER_APP_PASSWORD:-}
      BSKY_LABELER_DID: ${LABELER_DID:-}
      BSKY_DM_USERNAME: ${BSKY_DM_USERNAME:-}
      BSKY_DM_PASSWORD: ${BSKY_DM_PASSWORD:-}
      OZONE_URL: ${OZONE_URL:-}
      POLLING_SECONDS: ${POLLING_SECONDS:-30}
      WHITELISTED_MODERATORS: ${WHITELISTED_MODERATORS:-}
      MODERATOR_NOTIFICATIONS: ${MODERATOR_NOTIFICATIONS:-}
    volumes:
      - ./data/autolabel:/data
    restart: unless-stopped
