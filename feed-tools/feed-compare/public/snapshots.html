<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed Compare — Snapshots</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header style="display:flex;align-items:center;gap:16px">
  <h1>Snapshots</h1>
  <a href="/" style="font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px">Back to Compare</a>
</header>

<div class="container">
  <div id="error" class="error-msg" style="display:none"></div>

  <!-- Sessions panel -->
  <div class="snap-panel">
    <div class="snap-panel-header">
      <span>Auto-Snapshot Sessions</span>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="filter-session-profile" onchange="renderSessions()" style="font-size:12px;padding:4px 8px"><option value="">All profiles</option></select>
        <button onclick="showNewSession()">+ New Session</button>
      </div>
    </div>
    <div id="new-session-form" style="display:none" class="new-session-form">
      <select id="ns-profile" onchange="loadProfileIntoSession()" style="flex:none"><option value="">-- load a profile --</option></select>
      <input id="ns-name" placeholder="Session name" />
      <input id="ns-feedA" placeholder="Feed A URL" />
      <input id="ns-feedB" placeholder="Feed B URL" />
      <select id="ns-limit">
        <option value="50">50 posts</option>
        <option value="100" selected>100 posts</option>
        <option value="250">250 posts</option>
      </select>
      <select id="ns-interval">
        <option value="30000">30s</option>
        <option value="60000" selected>1m</option>
        <option value="300000">5m</option>
        <option value="900000">15m</option>
      </select>
      <label class="row-label" style="flex:none">Max</label>
      <input id="ns-max" type="number" min="1" max="999" value="10" style="width:60px;flex:none" />
      <button class="primary" onclick="createSession()">Create</button>
      <button onclick="hideNewSession()">Cancel</button>
    </div>
    <div id="sessions-list"></div>
  </div>

  <!-- Snapshot browser -->
  <div class="snap-panel">
    <div class="snap-panel-header">
      <span>Snapshots <span id="snap-count" style="color:var(--muted);font-size:12px"></span></span>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="filter-profile" onchange="renderSnapList()">
          <option value="">All profiles</option>
        </select>
        <button id="compare-selected-btn" onclick="compareSelected()" style="display:none" class="primary">Compare Selected (<span id="sel-count">0</span>)</button>
      </div>
    </div>
    <div id="snap-list"></div>
  </div>

  <!-- Timeline view -->
  <div id="timeline" style="display:none"></div>
</div>

<script src="utils.js"></script>
<script src="snapshots.js"></script>
</body>
</html>
