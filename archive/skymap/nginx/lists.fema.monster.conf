# Nginx configuration for lists.fema.monster (AT Protocol proxy)
# This file should be symlinked to /etc/nginx/sites-enabled/lists.fema.monster

server {
    listen 80;
    server_name lists.fema.monster;

    # Redirect HTTP to HTTPS (after SSL is set up)
    # Uncomment after running certbot:
    # return 301 https://$server_name$request_uri;

    # For initial setup (before SSL), proxy to proxy service:
    location / {
        proxy_pass http://localhost:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# HTTPS configuration (added by certbot after SSL setup)
# Certbot will automatically add a server block for port 443
