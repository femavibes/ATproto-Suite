# Nginx configuration for skymap.fema.monster (web-directory service)
# This file should be symlinked to /etc/nginx/sites-enabled/skymap.fema.monster

server {
    listen 80;
    server_name skymap.fema.monster;

    # Redirect HTTP to HTTPS (after SSL is set up)
    # Uncomment after running certbot:
    # return 301 https://$server_name$request_uri;

    # For initial setup (before SSL), proxy to web-directory service:
    location / {
        proxy_pass http://localhost:3008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Pass through CORS headers from backend
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
        proxy_pass_header Access-Control-Allow-Credentials;
        
        # Don't buffer responses (important for CORS)
        proxy_buffering off;
    }
}

# HTTPS configuration (added by certbot after SSL setup)
# Certbot will automatically add a server block for port 443
# Make sure to add the proxy_pass_header directives there too
