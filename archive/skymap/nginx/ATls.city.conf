# Nginx configuration for ATls.city (main app)
# This file should be symlinked to /etc/nginx/sites-enabled/ATls.city

server {
    listen 80;
    server_name ATls.city www.ATls.city;

    # Redirect HTTP to HTTPS (after SSL is set up)
    # Uncomment after running certbot:
    # return 301 https://$server_name$request_uri;

    # For initial setup (before SSL), proxy to app:
    location / {
        proxy_pass http://localhost:3008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

