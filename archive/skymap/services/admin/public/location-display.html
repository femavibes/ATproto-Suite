<h2 class="page-title">Location Display Overrides</h2>
<p style="text-align: center; color: #525252; margin-bottom: 1.5rem;">Override list keys and display names for locations (e.g., "New York" → "New York City")</p>

<div style="margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">
    <input type="text" id="locationDisplaySearchInput" placeholder="Search locations..." onkeyup="filterLocations()" style="flex: 1; min-width: 200px; padding: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 12px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); font-size: 0.9375rem;">
    <select id="filterType" onchange="filterLocations()" style="padding: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 12px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); font-size: 0.9375rem;">
        <option value="all">All Locations</option>
        <option value="with-override">With Overrides</option>
        <option value="without-override">Without Overrides</option>
    </select>
</div>

<div id="locationsContainer">Loading...</div>

<div class="pagination" id="pagination"></div>

<!-- Edit Modal -->
<div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;" onclick="closeModal(event)">
    <div style="background: white; padding: 2rem; border-radius: 12px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;" onclick="event.stopPropagation()">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2 id="modalTitle" style="font-size: 1.5rem; margin: 0;">Edit Display Overrides</h2>
            <button onclick="closeModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #737373; padding: 0; width: 2rem; height: 2rem;">&times;</button>
        </div>
        <div id="modalBody">
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Location</label>
                <div style="padding: 0.75rem; background: #f5f5f5; border-radius: 8px; font-weight: 600;" id="modalLocationName"></div>
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Current Key</label>
                <div style="padding: 0.75rem; background: #f5f5f5; border-radius: 8px; font-family: monospace; font-size: 0.9rem;" id="modalCurrentKey"></div>
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Display Key (for list URLs)</label>
                <input type="text" id="modalDisplayKey" placeholder="e.g., US-NY-NewYorkCity" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-family: monospace; font-size: 0.9rem;">
                <div style="font-size: 0.85rem; color: #737373; margin-top: 0.25rem;">Leave empty to use current key. Format: US-OR-Portland</div>
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Display Name</label>
                <input type="text" id="modalDisplayName" placeholder="e.g., New York City" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem;">
                <div style="font-size: 0.85rem; color: #737373; margin-top: 0.25rem;">Leave empty to use current name</div>
            </div>
            <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                <button onclick="closeModal()" style="padding: 0.75rem 1.5rem; background: #f5f5f5; border: none; border-radius: 8px; cursor: pointer; font-weight: 500;">Cancel</button>
                <button onclick="saveOverrides()" style="padding: 0.75rem 1.5rem; background: rgba(23, 23, 23, 0.9); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500;">Save</button>
                <button onclick="removeOverrides()" id="removeBtn" style="padding: 0.75rem 1.5rem; background: #dc2626; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; display: none;">Remove Overrides</button>
            </div>
        </div>
    </div>
</div>

<script>
    var allLocations = [];
    var filteredLocations = [];
    var currentPage = 1;
    var itemsPerPage = 20;
    var currentEditingId = null;

    async function loadLocations() {
        try {
            const response = await fetch('/api/locations', { headers: getAuthHeaders() });
            allLocations = await response.json();
            allLocations = allLocations.filter(loc => loc.population); // Only show locations with population
            filteredLocations = allLocations;
            renderPage();
        } catch (error) {
            console.error('Error loading locations:', error);
            document.getElementById('locationsContainer').innerHTML = '<div style="text-align: center; color: #dc2626;">Error loading locations</div>';
        }
    }

    function filterLocations() {
        const searchTerm = document.getElementById('locationDisplaySearchInput').value.toLowerCase();
        const filterType = document.getElementById('filterType').value;
        
        filteredLocations = allLocations.filter(loc => {
            const matchesSearch = 
                loc.name.toLowerCase().includes(searchTerm) ||
                loc.region_name?.toLowerCase().includes(searchTerm) ||
                loc.key.toLowerCase().includes(searchTerm) ||
                (loc.display_key && loc.display_key.toLowerCase().includes(searchTerm)) ||
                (loc.display_name && loc.display_name.toLowerCase().includes(searchTerm));
            
            const hasOverride = !!(loc.display_key || loc.display_name);
            
            if (filterType === 'with-override' && !hasOverride) return false;
            if (filterType === 'without-override' && hasOverride) return false;
            
            return matchesSearch;
        });
        
        currentPage = 1;
        renderPage();
    }

    function renderPage() {
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageItems = filteredLocations.slice(startIndex, endIndex);
        
        const container = document.getElementById('locationsContainer');
        container.innerHTML = pageItems.map(loc => {
            const hasOverride = !!(loc.display_key || loc.display_name);
            const displayKey = loc.display_key || loc.key;
            const displayName = loc.display_name || loc.name;
            const listUri = `at://did:web:lists.fema.monster/app.bsky.graph.list/${displayKey}`;
            
            return `
                <div style="background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 16px; padding: 1rem; margin: 0.5rem 0; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); ${hasOverride ? 'border-left: 4px solid #10b981;' : ''}">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; gap: 1rem;">
                        <div style="flex: 1;">
                            <div style="font-weight: 600; font-size: 1.1rem; margin-bottom: 0.25rem;">
                                ${displayName}
                                ${hasOverride ? '<span style="font-size: 0.75rem; color: #10b981; margin-left: 0.5rem; font-weight: 500;">(OVERRIDE)</span>' : ''}
                            </div>
                            <div style="color: #737373; font-size: 0.9rem;">
                                ${loc.name}${loc.display_name ? ` → ${loc.display_name}` : ''}, ${loc.region_name || ''}
                            </div>
                        </div>
                        <button onclick="editLocation(${loc.id})" style="padding: 0.5rem 1rem; background: rgba(23, 23, 23, 0.9); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 0.875rem; font-weight: 500; white-space: nowrap;">
                            ${hasOverride ? 'Edit' : 'Set Override'}
                        </button>
                    </div>
                    <div style="margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid rgba(0,0,0,0.1);">
                        <div style="margin-bottom: 0.5rem;">
                            <div style="font-size: 0.85rem; color: #737373; margin-bottom: 0.25rem;">Database Key:</div>
                            <div style="font-family: monospace; font-size: 0.9rem; background: #f5f5f5; padding: 0.5rem; border-radius: 6px; word-break: break-all;">${loc.key}</div>
                        </div>
                        ${hasOverride ? `
                            <div style="margin-bottom: 0.5rem;">
                                <div style="font-size: 0.85rem; color: #10b981; margin-bottom: 0.25rem;">Display Key:</div>
                                <div style="font-family: monospace; font-size: 0.9rem; background: #d1fae5; padding: 0.5rem; border-radius: 6px; word-break: break-all;">${loc.display_key}</div>
                            </div>
                        ` : ''}
                        <div style="margin-top: 0.5rem;">
                            <div style="font-size: 0.85rem; color: #737373; margin-bottom: 0.25rem;">List URI:</div>
                            <div style="font-family: monospace; font-size: 0.85rem; background: #f5f5f5; padding: 0.5rem; border-radius: 6px; word-break: break-all;">${listUri}</div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
        
        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.ceil(filteredLocations.length / itemsPerPage);
        const pagination = document.getElementById('pagination');
        
        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }
        
        let html = `<button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>`;
        
        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                html += `<button onclick="changePage(${i})" style="${i === currentPage ? 'background: rgba(23, 23, 23, 0.9); color: white;' : ''}">${i}</button>`;
            } else if (i === currentPage - 3 || i === currentPage + 3) {
                html += `<span>...</span>`;
            }
        }
        
        html += `<button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>`;
        pagination.innerHTML = html;
    }

    function changePage(page) {
        const totalPages = Math.ceil(filteredLocations.length / itemsPerPage);
        if (page >= 1 && page <= totalPages) {
            currentPage = page;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    async function editLocation(locationId) {
        const location = allLocations.find(l => l.id === locationId);
        if (!location) return;
        
        currentEditingId = locationId;
        document.getElementById('modalLocationName').textContent = `${location.name}, ${location.region_name || ''}`;
        document.getElementById('modalCurrentKey').textContent = location.key;
        document.getElementById('modalDisplayKey').value = location.display_key || '';
        document.getElementById('modalDisplayName').value = location.display_name || '';
        
        const removeBtn = document.getElementById('removeBtn');
        if (location.display_key || location.display_name) {
            removeBtn.style.display = 'inline-block';
        } else {
            removeBtn.style.display = 'none';
        }
        
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal(event) {
        if (!event || event.target.id === 'editModal') {
            document.getElementById('editModal').style.display = 'none';
            currentEditingId = null;
        }
    }

    async function saveOverrides() {
        if (!currentEditingId) return;
        
        const displayKey = document.getElementById('modalDisplayKey').value.trim();
        const displayName = document.getElementById('modalDisplayName').value.trim();
        
        // Validate display_key format if provided
        if (displayKey && !/^[A-Z]{2}-[A-Z]{2}-[A-Za-z0-9]+$/.test(displayKey)) {
            alert('Invalid display key format. Expected format: US-OR-Portland');
            return;
        }
        
        try {
            const response = await fetch(`/api/location-display/${currentEditingId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    ...getAuthHeaders()
                },
                body: JSON.stringify({
                    display_key: displayKey || null,
                    display_name: displayName || null
                })
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || 'Failed to save overrides');
            }
            
            const result = await response.json();
            alert(result.message || 'Overrides saved successfully!');
            
            // Reload locations
            await loadLocations();
            closeModal();
        } catch (error) {
            console.error('Error saving overrides:', error);
            alert('Error: ' + error.message);
        }
    }

    async function removeOverrides() {
        if (!currentEditingId) return;
        
        if (!confirm('Remove display overrides for this location?')) return;
        
        try {
            const response = await fetch(`/api/location-display/${currentEditingId}`, {
                method: 'DELETE',
                headers: getAuthHeaders()
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || 'Failed to remove overrides');
            }
            
            const result = await response.json();
            alert(result.message || 'Overrides removed successfully!');
            
            // Reload locations
            await loadLocations();
            closeModal();
        } catch (error) {
            console.error('Error removing overrides:', error);
            alert('Error: ' + error.message);
        }
    }

    // Load locations when component is loaded
    loadLocations();
</script>
