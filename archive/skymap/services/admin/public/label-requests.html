<div style="padding: 1rem;">
    <h2>Label Requests</h2>
    <div style="display: flex; gap: 0.5rem; margin: 1rem 0;">
        <button class="img-tab-btn" style="margin:0;" onclick="loadLabelRequests('pending')">Pending</button>
        <button class="img-tab-btn" style="margin:0;" onclick="loadLabelRequests('approved')">Approved</button>
        <button class="img-tab-btn" style="margin:0;" onclick="loadLabelRequests('denied')">Denied</button>
        <button class="img-tab-btn" style="margin:0;" onclick="loadLabelRequests()">All</button>
    </div>
    <div id="labelRequestsList" style="font-size: 0.875rem; color: #525252;">Loading...</div>
</div>

<script>
async function loadLabelRequests(status) {
    const container = document.getElementById('labelRequestsList');
    container.innerHTML = 'Loading...';
    try {
        const url = status ? `/api/admin/label-requests?status=${status}` : '/api/admin/label-requests';
        const res = await fetch(url, { headers: getAuthHeaders() });
        const data = await res.json();
        if (!data.requests || !data.requests.length) {
            container.innerHTML = '<p style="color:#999;">No requests found.</p>';
            return;
        }
        container.innerHTML = data.requests.map(r => {
            const statusColor = r.status === 'approved' ? '#4caf50' : r.status === 'denied' ? '#f44336' : '#ff9800';
            const date = new Date(r.created_at).toLocaleString();
            const isPending = r.status === 'pending';
            return `<div style="padding: 1rem; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 0.75rem; background: #fafafa;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
                    <div>
                        <span style="font-weight: 600; font-size: 1rem;">${r.request_type === 'add' ? '+ Add' : '− Remove'} <code>${r.location_key}</code></span>
                        ${r.location_name ? `<span style="color:#999;"> (${r.location_name})</span>` : ''}
                    </div>
                    <span style="color: ${statusColor}; font-weight: 600; text-transform: uppercase; font-size: 0.75rem;">${r.status}</span>
                </div>
                <div style="margin-bottom: 0.5rem;">
                    <strong>Target:</strong> @${r.target_handle} <span style="color:#999; font-size: 0.75rem;">(${r.target_did})</span>
                </div>
                <div style="margin-bottom: 0.5rem;">
                    <strong>Requested by:</strong> ${r.requester_handle || r.requester_did} <span style="color:#999; font-size: 0.75rem;">${date}</span>
                </div>
                <div style="margin-bottom: 0.75rem; padding: 0.5rem; background: #f0f0f0; border-radius: 6px;">
                    <strong>Reason:</strong> ${r.reason}
                </div>
                ${r.review_notes ? `<div style="margin-bottom: 0.5rem; color: #666; font-style: italic;">Admin notes: ${r.review_notes}</div>` : ''}
                ${isPending ? `
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <input type="text" id="lr-notes-${r.id}" placeholder="Admin notes (optional)" style="flex: 1; padding: 0.5rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.8125rem;" />
                        <button onclick="reviewLabelRequest(${r.id}, 'approve')" style="padding: 0.5rem 1rem; background: #4caf50; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">Approve</button>
                        <button onclick="reviewLabelRequest(${r.id}, 'deny')" style="padding: 0.5rem 1rem; background: #f44336; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">Deny</button>
                    </div>
                ` : ''}
            </div>`;
        }).join('');
    } catch(e) {
        container.innerHTML = '<p style="color:red;">Error loading requests.</p>';
        console.error('Error loading label requests:', e);
    }
}

async function reviewLabelRequest(id, action) {
    const notes = document.getElementById(`lr-notes-${id}`)?.value || '';
    if (!confirm(`${action === 'approve' ? 'Approve' : 'Deny'} this label request?`)) return;
    try {
        const res = await fetch(`/api/admin/label-requests/${id}/review`, {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({ action, notes })
        });
        const data = await res.json();
        if (res.ok) {
            alert(data.message || 'Done!');
            loadLabelRequests('pending');
        } else {
            alert(data.error || 'Failed');
        }
    } catch(e) {
        alert('Network error');
        console.error('Error reviewing label request:', e);
    }
}

loadLabelRequests('pending');
</script>
