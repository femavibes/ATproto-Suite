<!DOCTYPE html>
<html>
<head>
    <title>Location Display Overrides - ATlas Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { overflow-y: scroll; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.35) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(147, 197, 253, 0.2) 0%, transparent 50%),
                linear-gradient(135deg, #f8f9fa 0%, #faf5ff 50%, #f1f3f4 100%);
            color: #171717;
            line-height: 1.5;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 2.5rem; font-weight: 600; color: #171717; margin-bottom: 0.5rem; }
        .header p { color: #737373; font-size: 1.125rem; }
        .page-title { display: none; text-align: center; font-size: 1.5rem; font-weight: 600; color: #171717; margin: 1rem 0 0.5rem 0; }
        @media (max-width: 768px) {
            .header { margin-bottom: 1rem; }
            .page-title { display: block; }
        }
        .section { 
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(120, 119, 198, 0.12);
        }
        .location { 
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 1rem;
            margin: 0.5rem 0;
            box-shadow: 0 8px 32px rgba(120, 119, 198, 0.12);
            transition: all 0.15s ease;
        }
        .location:hover { border-color: #d4d4d4; }
        .location-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; gap: 0.5rem; }
        .location-name { font-weight: 600; color: #171717; flex: 1 1 0; min-width: 0; overflow-wrap: break-word; }
        .location-key { font-family: ui-monospace, 'SF Mono', Monaco, monospace; background: #f5f5f5; padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.9rem; white-space: nowrap; flex-shrink: 0; }
        .hashtags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.5rem 0; }
        .hashtag { background: #e3f2fd; color: #1976d2; padding: 0.2rem 0.5rem; border-radius: 12px; font-size: 0.85rem; display: flex; align-items: center; gap: 0.3rem; }
        .hashtag .remove { cursor: pointer; color: #d32f2f; font-weight: bold; }
        .add-hashtag { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
        .add-hashtag input { 
            flex: 1;
            min-width: 0;
            padding: 0.875rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            font-size: 0.9375rem;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px);
            transition: border-color 0.15s ease;
            box-shadow: 0 4px 16px rgba(120, 119, 198, 0.08);
        }
        .add-hashtag input:focus { outline: none; border-color: #171717; }
        .add-hashtag button { 
            padding: 0.875rem 1.5rem;
            background: rgba(23, 23, 23, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        .add-hashtag button:hover { 
            background: rgba(64, 64, 64, 0.9);
            transform: translateY(-1px);
        }
        .filter { margin-bottom: 1rem; }
        .filter select { 
            padding: 0.875rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            font-size: 0.9375rem;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            transition: border-color 0.15s ease;
            margin-right: 1rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }
        .filter select:focus { outline: none; border-color: #171717; }
        .filter input { 
            padding: 0.875rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            font-size: 0.9375rem;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            transition: border-color 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }
        .filter input:focus { outline: none; border-color: #171717; }
        .graze-output { 
            background: rgba(248, 248, 248, 0.8);
            backdrop-filter: blur(20px);
            padding: 1rem;
            border-radius: 12px;
            font-family: ui-monospace, 'SF Mono', Monaco, monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }
        .stats { 
            background: rgba(240, 248, 255, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }
        .stat { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #1976d2; }
        .stat-label { font-size: 0.9rem; color: #737373; }
        .parser-controls { margin-top: 1rem; }
        .threshold-control { display: flex; align-items: center; gap: 1rem; margin: 1rem 0; }
        .threshold-control label { font-weight: 500; }
        .threshold-control input { 
            width: 120px;
            padding: 0.875rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            font-size: 0.9375rem;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            transition: border-color 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }
        .threshold-control input:focus { outline: none; border-color: #171717; }
        .threshold-control button { 
            padding: 0.875rem 1.5rem;
            background: rgba(23, 23, 23, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }
        .threshold-control button:hover { 
            background: rgba(64, 64, 64, 0.9);
            transform: translateY(-1px);
        }
        button:not(.tab) {
            padding: 0.875rem 1.5rem;
            background: rgba(23, 23, 23, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }
        button:not(.tab):hover {
            background: rgba(64, 64, 64, 0.9);
            transform: translateY(-1px);
        }
        button:not(.tab):disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        input[type="text"], input[type="number"], select, textarea {
            padding: 0.875rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            font-size: 0.9375rem;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px);
            transition: border-color 0.15s ease;
            box-shadow: 0 4px 16px rgba(120, 119, 198, 0.08);
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #171717;
        }
        .radio-card input[type="radio"] {
            padding: 0;
            box-shadow: none;
        }
        .note { font-size: 0.9rem; color: #737373; font-style: italic; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 1rem; margin: 1rem 0; }
        .pagination button { 
            padding: 0.875rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            cursor: pointer;
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 500;
            color: #171717;
            transition: all 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }
        .pagination button:hover { 
            background: rgba(245, 245, 245, 0.8);
            transform: translateY(-1px);
        }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination .current { 
            background: rgba(23, 23, 23, 0.9);
            color: white;
            border-color: rgba(23, 23, 23, 0.9);
        }
        .results-info { text-align: center; color: #737373; margin: 1rem 0; }
        .tabs {
            display: flex;
            gap: 0;
            justify-content: center;
        }
        .tab {
            padding: 0.875rem 1.5rem;
            background: rgba(23, 23, 23, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            border: 1px solid rgba(23, 23, 23, 0.9);
            border-right: none;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            text-decoration: none;
        }
        .tab:first-child {
            border-radius: 12px 0 0 12px;
        }
        .tab:last-child {
            border-radius: 0 12px 12px 0;
            border-right: 1px solid rgba(23, 23, 23, 0.9);
        }
        .tab:hover {
            background: rgba(64, 64, 64, 0.9);
            color: white;
            z-index: 1;
        }
        .tab.active {
            background: rgba(255, 255, 255, 0.9);
            color: #171717;
            border-color: rgba(255, 255, 255, 0.9);
            z-index: 2;
        }
        .tab-text { display: inline; }
        .tab-icon { display: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        @media (max-width: 768px) {
            .tab { padding: 0.75rem; }
            .tab-text { display: none; }
            .tab-icon { display: block; }
            .threshold-control { flex-wrap: wrap; }
            .threshold-control label, .threshold-control input { flex-basis: 100%; }
            .threshold-control button { width: 100%; }
            .filter { display: flex; flex-direction: column; gap: 0.5rem; }
            .filter select, .filter input { margin-right: 0; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="headerContainer"></div>
        <div id="content"></div>
    </div>

    <script src="shared.js"></script>
    <script>
        async function loadComponent(file, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            try {
                const response = await fetch(file);
                const html = await response.text();
                container.innerHTML = html;
                
                // Execute any scripts in the loaded content
                const scripts = container.querySelectorAll('script');
                scripts.forEach(script => {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = script.src;
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    document.body.appendChild(newScript);
                    script.remove();
                });
            } catch (error) {
                console.error(`Error loading ${file}:`, error);
            }
        }

        async function init() {
            await loadComponent('header.html', 'headerContainer');
            await loadComponent('location-display.html', 'content');
        }

        init();
    </script>
</body>
</html>
