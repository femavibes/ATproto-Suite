<!DOCTYPE html>
<html>
<head>
    <title>AT Protocol Lists - SkyMap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { overflow-y: scroll; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.15) 0%, transparent 50%),
                linear-gradient(135deg, #f8f9fa 0%, #ffffff 50%, #f1f3f4 100%);
            color: #171717;
            line-height: 1.5;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 2.5rem; font-weight: 600; color: #171717; margin-bottom: 0.5rem; }
        .header p { color: #737373; font-size: 1.125rem; }
        .page-title { display: none; text-align: center; font-size: 1.5rem; font-weight: 600; color: #171717; margin: 1rem 0 0.5rem 0; }
        @media (max-width: 768px) {
            .header { margin-bottom: 1rem; }
            .page-title { display: block; }
        }
        .info-box { background: #e3f2fd; padding: 1rem; border-radius: 8px; margin-bottom: 2rem; }
        .info-box code { background: #fff; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; }
        .location { 
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            padding: 1rem;
            margin: 0.5rem 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.15s ease;
        }
        .location:hover { border-color: #d4d4d4; }
        .location-name { font-weight: 600; font-size: 1.1rem; margin-bottom: 0.5rem; }
        .list-uri { background: rgba(229, 229, 229, 0.9); color: #525252; padding: 0.5rem; border-radius: 8px; font-family: monospace; font-size: 0.9rem; word-break: break-all; margin: 0.5rem 0; display: block; }
        .stats { color: #737373; font-size: 0.9rem; margin-top: 0.5rem; }
        .copy-btn {
            padding: 0.5rem;
            font-size: 0.8125rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            backdrop-filter: blur(20px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            background: rgba(245, 245, 245, 0.8);
            color: #737373;
        }
        .copy-btn:hover {
            background: rgba(229, 229, 229, 0.9);
            color: #171717;
            transform: translateY(-1px);
        }
        .search-box { margin-bottom: 1rem; }
        .search-box input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        .pagination { display: flex; justify-content: center; gap: 0.5rem; margin: 1rem 0; }
        .pagination button { padding: 0.5rem 1rem; background: white; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; }
        .pagination button:hover { background: #f5f5f5; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination .active { background: #7b1fa2; color: white; border-color: #7b1fa2; }
        .how-to-add { background: #fff3e0; padding: 1rem; border-radius: 8px; margin-bottom: 2rem; }
        .how-to-add h3 { margin-bottom: 0.5rem; color: #e65100; }
        .how-to-add ol { margin-left: 1.5rem; }
        .how-to-add li { margin: 0.5rem 0; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 2rem; border-radius: 12px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .modal-header h2 { font-size: 1.5rem; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #737373; }
        .close-btn:hover { color: #171717; }
        .search-container { display: flex; gap: 0.5rem; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #e0e0e0; }
        .search-container input { flex: 1; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; }
        .search-container button { padding: 0.75rem 1.5rem; background: #7b1fa2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .search-container button:hover { background: #8e24aa; }
        .result-box { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; }
        .result-box.found { background: #e8f5e9; color: #2e7d32; }
        .result-box.not-found { background: #ffebee; color: #c62828; }
        .user-list { max-height: 300px; overflow-y: auto; }
        .user-item { padding: 0.75rem; border-bottom: 1px solid #f0f0f0; font-family: monospace; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
        .user-item:last-child { border-bottom: none; }
        .profile-link { display: inline-flex; align-items: center; opacity: 0.6; transition: opacity 0.2s; }
        .profile-link:hover { opacity: 1; }
        .view-users-btn {
            padding: 0.5rem;
            font-size: 0.8125rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            backdrop-filter: blur(20px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            background: rgba(200, 200, 200, 0.8);
            color: #525252;
        }
        .view-users-btn:hover {
            background: rgba(180, 180, 180, 0.9);
            color: #171717;
            transform: translateY(-1px);
        }
        .loading { text-align: center; padding: 2rem; color: #737373; }
        .tabs {
            display: flex;
            gap: 0;
            justify-content: center;
        }
        .tab {
            padding: 0.875rem 1.5rem;
            background: rgba(23, 23, 23, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            border: 1px solid rgba(23, 23, 23, 0.9);
            border-right: none;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            text-decoration: none;
        }
        .tab:first-child {
            border-radius: 12px 0 0 12px;
        }
        .tab:last-child {
            border-radius: 0 12px 12px 0;
            border-right: 1px solid rgba(23, 23, 23, 0.9);
        }
        .tab:hover {
            background: rgba(64, 64, 64, 0.9);
            color: white;
            z-index: 1;
        }
        .tab.active {
            background: rgba(255, 255, 255, 0.9);
            color: #171717;
            border-color: rgba(255, 255, 255, 0.9);
            z-index: 2;
        }
        .tab-text { display: inline; }
        .tab-icon { display: none; }
        @media (max-width: 768px) {
            .tab { padding: 0.75rem; }
            .tab-text { display: none; }
            .tab-icon { display: block; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SkyMap Admin</h1>
            <div class="tabs" style="margin-top: 1rem;">
                <a href="/" class="tab">
                    <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></span>
                    <span class="tab-text">Locations</span>
                </a>
                <a href="/lists.html" class="tab active">
                    <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg></span>
                    <span class="tab-text">AT Protocol Lists</span>
                </a>
                <a href="/feeds.html" class="tab">
                    <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg></span>
                    <span class="tab-text">Feeds</span>
                </a>
                <a href="/custom_node.html" class="tab">
                    <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg></span>
                    <span class="tab-text">Custom Node</span>
                </a>
                <a href="/data_sources.html" class="tab">
                    <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg></span>
                    <span class="tab-text">Data Sources</span>
                </a>
                <a href="/ingestion.html" class="tab">
                    <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></span>
                    <span class="tab-text">Ingestion</span>
                </a>
                <a href="/whitelist.html" class="tab">
                    <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87m-4-12a4 4 0 0 1 0 7.75"></path></svg></span>
                    <span class="tab-text">Admin Users</span>
                </a>
            </div>
        </div>

        <h2 class="page-title">AT Protocol Lists</h2>
        <p style="text-align: center; color: #525252; margin-bottom: 1.5rem;">Unlimited member lists powered by did:web:lists.fema.monster</p>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search locations..." onkeyup="filterLocations()">
        </div>

        <div id="locations">Loading...</div>
        
        <div class="pagination" id="pagination"></div>
    </div>

    <div id="userModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modalTitle">Users in List</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="search-container">
                <input type="text" id="handleSearch" placeholder="Check if handle is in list (e.g., user.bsky.social)" />
                <button onclick="searchUser()">Check</button>
            </div>
            <div id="searchResult"></div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        let allLocations = [];
        let filteredLocations = [];
        let currentPage = 1;
        const itemsPerPage = 20;

        function getAuthHeaders() {
            const credentials = btoa('skymap-5000.bsky.social:elok-l2zm-zl2i-k473');
            return {
                'Authorization': `Basic ${credentials}`,
                'Content-Type': 'application/json'
            };
        }

        async function loadLists() {
            const response = await fetch('/api/locations', { headers: getAuthHeaders() });
            allLocations = await response.json();
            allLocations = allLocations.filter(loc => loc.population); // Only cities
            filteredLocations = allLocations;
            renderPage();
        }

        function filterLocations() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            filteredLocations = allLocations.filter(loc => 
                loc.name.toLowerCase().includes(searchTerm) ||
                loc.region_name.toLowerCase().includes(searchTerm) ||
                loc.key.toLowerCase().includes(searchTerm)
            );
            currentPage = 1;
            renderPage();
        }

        function renderPage() {
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageItems = filteredLocations.slice(startIndex, endIndex);
            
            const container = document.getElementById('locations');
            container.innerHTML = pageItems.map(loc => {
                const listUri = `at://did:web:lists.fema.monster/app.bsky.graph.list/${loc.key}`;
                const userCount = loc.user_count || 0;
                
                return `
                    <div class="location">
                        <div class="location-name">${loc.name}, ${loc.region_name}</div>
                        <div class="list-uri">
                            ${listUri}
                        </div>
                        <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                            <button class="copy-btn" onclick="copyToClipboard('${listUri}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </button>
                            <button class="view-users-btn" onclick="viewUsers('${loc.key}', '${loc.name}, ${loc.region_name}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="9" cy="7" r="4"></circle>
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                                </svg>
                            </button>
                        </div>
                        <div class="stats">
                            ${userCount} users • Population: ${loc.population?.toLocaleString()}
                        </div>
                    </div>
                `;
            }).join('');
            
            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredLocations.length / itemsPerPage);
            const pagination = document.getElementById('pagination');
            
            let html = `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>
            `;
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<button onclick="changePage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<span>...</span>`;
                }
            }
            
            html += `
                <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
            `;
            
            pagination.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredLocations.length / itemsPerPage);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                renderPage();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            });
        }

        async function viewUsers(locationKey, locationName) {
            const modal = document.getElementById('userModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const searchResult = document.getElementById('searchResult');
            
            window.currentLocationKey = locationKey;
            modalTitle.textContent = `Users in ${locationName}`;
            modalBody.innerHTML = '<div class="loading">Loading users...</div>';
            searchResult.innerHTML = '';
            document.getElementById('handleSearch').value = '';
            modal.classList.add('show');
            
            try {
                const response = await fetch(`/api/locations/${locationKey}/users`, { headers: getAuthHeaders() });
                const users = await response.json();
                
                if (users.length === 0) {
                    modalBody.innerHTML = '<div class="loading">No users in this list yet</div>';
                } else {
                    modalBody.innerHTML = '<div class="user-list">' + users.map(user => `
                        <div class="user-item">
                            <span>${user.handle}</span>
                            <a href="https://bsky.app/profile/${user.handle}" target="_blank" class="profile-link" title="View on Bluesky">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                    <polyline points="15 3 21 3 21 9"></polyline>
                                    <line x1="10" y1="14" x2="21" y2="3"></line>
                                </svg>
                            </a>
                        </div>
                    `).join('') + '</div>';
                }
            } catch (error) {
                modalBody.innerHTML = '<div class="loading">Failed to load users</div>';
            }
        }

        async function searchUser() {
            const handle = document.getElementById('handleSearch').value.trim().replace('@', '');
            const searchResult = document.getElementById('searchResult');
            
            if (!handle) return;
            
            searchResult.innerHTML = '<div class="loading">Checking...</div>';
            
            try {
                const response = await fetch(`/api/locations/${window.currentLocationKey}/check-user?handle=${encodeURIComponent(handle)}`, { headers: getAuthHeaders() });
                const data = await response.json();
                
                if (data.inList) {
                    searchResult.innerHTML = `<div class="result-box found">✓ @${handle} is in this list</div>`;
                } else {
                    searchResult.innerHTML = `<div class="result-box not-found">✗ @${handle} is not in this list</div>`;
                }
            } catch (error) {
                searchResult.innerHTML = '<div class="result-box not-found">Error checking user</div>';
            }
        }

        function closeModal(event) {
            if (!event || event.target.id === 'userModal') {
                document.getElementById('userModal').classList.remove('show');
            }
        }

        document.getElementById('handleSearch').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchUser();
        });

        loadLists();
    </script>
</body>
</html>
