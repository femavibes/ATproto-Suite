<!DOCTYPE html>
<html>
<head>
    <title>User Management - SkyMap Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 50%, #f1f3f4 100%);
            color: #171717;
            padding: 2rem;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { margin-bottom: 2rem; text-align: center; }
        .section { 
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .search-box { 
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        .search-box input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        .search-box button {
            padding: 0.75rem 1.5rem;
            background: #171717;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }
        .search-box button:hover { background: #404040; }
        .user-info {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .label-selector {
            display: grid;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .label-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .label-option.active {
            background: #e3f2fd;
            border: 2px solid #1976d2;
        }
        .label-name { font-weight: 500; }
        .label-key {
            font-family: monospace;
            background: #e0e0e0;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.875rem;
        }
        .btn-add, .btn-remove {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-add {
            background: #4caf50;
            color: white;
        }
        .btn-add:hover { background: #45a049; }
        .btn-remove {
            background: #f44336;
            color: white;
        }
        .btn-remove:hover { background: #da190b; }
        .current-labels {
            margin-top: 1.5rem;
        }
        .current-labels h3 {
            margin-bottom: 1rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #1976d2;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Admin</a>
        <h1>User Management</h1>
        
        <div class="section">
            <h2>Manage User Labels</h2>
            <p style="color: #737373; margin-bottom: 1rem;">Assign location labels to organizations and high-profile users</p>
            
            <div class="search-box">
                <input type="text" id="handleInput" placeholder="Enter Bluesky handle (e.g., user.bsky.social)" />
                <button onclick="loadUser()">Load User</button>
            </div>
            
            <div id="userSection" style="display: none;">
                <div class="user-info">
                    <strong>User:</strong> <span id="userHandle"></span><br>
                    <strong>DID:</strong> <span id="userDid" style="font-family: monospace; font-size: 0.875rem;"></span>
                </div>
                
                <div class="current-labels">
                    <h3>Current Labels (<span id="labelCount">0</span>/3)</h3>
                    <div id="currentLabels"></div>
                </div>
                
                <h3 style="margin-top: 2rem; margin-bottom: 1rem;">Available Locations</h3>
                <input type="text" id="locationSearch" placeholder="Search locations..." style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 1rem;" oninput="filterLocations()" />
                <div id="locationList" class="label-selector"></div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let allLocations = [];
        let userLabels = [];

        async function loadUser() {
            const handle = document.getElementById('handleInput').value.trim();
            if (!handle) {
                alert('Please enter a handle');
                return;
            }

            try {
                const response = await fetch(`/api/user-labels?handle=${encodeURIComponent(handle)}`);
                const data = await response.json();

                if (!response.ok) {
                    alert(data.error || 'Failed to load user');
                    return;
                }

                currentUser = { handle: data.handle, did: data.did };
                userLabels = data.databaseLabels || [];

                document.getElementById('userHandle').textContent = data.handle;
                document.getElementById('userDid').textContent = data.did;
                document.getElementById('labelCount').textContent = userLabels.length;
                document.getElementById('userSection').style.display = 'block';

                displayCurrentLabels();
                await loadLocations();
            } catch (error) {
                alert('Error loading user: ' + error.message);
            }
        }

        function displayCurrentLabels() {
            const container = document.getElementById('currentLabels');
            if (userLabels.length === 0) {
                container.innerHTML = '<p style="color: #737373;">No labels assigned</p>';
                return;
            }

            container.innerHTML = userLabels.map(label => `
                <div class="label-option active">
                    <div>
                        <span class="label-name">${label.name}, ${label.region_name}</span>
                        <span class="label-key">${label.key}</span>
                    </div>
                    <button class="btn-remove" onclick="removeLabel('${label.key}')">Remove</button>
                </div>
            `).join('');
        }

        async function loadLocations() {
            const response = await fetch('/api/all-locations');
            allLocations = await response.json();
            filterLocations();
        }

        function filterLocations() {
            const search = document.getElementById('locationSearch').value.toLowerCase();
            const filtered = allLocations.filter(loc => 
                loc.name.toLowerCase().includes(search) && 
                loc.population !== null
            );

            const container = document.getElementById('locationList');
            container.innerHTML = filtered.slice(0, 50).map(loc => {
                const hasLabel = userLabels.some(l => l.key === loc.key);
                return `
                    <div class="label-option ${hasLabel ? 'active' : ''}">
                        <div>
                            <span class="label-name">${loc.name}, ${loc.region_name}</span>
                            <span class="label-key">${loc.key}</span>
                        </div>
                        ${hasLabel ? 
                            `<button class="btn-remove" onclick="removeLabel('${loc.key}')">Remove</button>` :
                            `<button class="btn-add" onclick="addLabel('${loc.key}', '${loc.name}')">Add</button>`
                        }
                    </div>
                `;
            }).join('');
        }

        async function addLabel(locationKey, locationName) {
            if (!currentUser) return;

            if (userLabels.length >= 3) {
                alert('User already has 3 labels (maximum). Remove one first.');
                return;
            }

            try {
                const response = await fetch('/api/admin/user-labels', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        did: currentUser.did,
                        locationKey: locationKey
                    })
                });

                const data = await response.json();
                if (!response.ok) {
                    alert(data.error || 'Failed to add label');
                    return;
                }

                alert(`Added ${locationName} to ${currentUser.handle}`);
                loadUser();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function removeLabel(locationKey) {
            if (!currentUser) return;

            if (!confirm(`Remove this label from ${currentUser.handle}?`)) {
                return;
            }

            try {
                const response = await fetch('/api/admin/user-labels', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        did: currentUser.did,
                        locationKey: locationKey
                    })
                });

                const data = await response.json();
                if (!response.ok) {
                    alert(data.error || 'Failed to remove label');
                    return;
                }

                alert('Label removed');
                loadUser();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
