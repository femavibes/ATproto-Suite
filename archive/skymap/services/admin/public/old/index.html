<!DOCTYPE html>
<html>
<head>
    <title>SkyMap Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { overflow-y: scroll; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.15) 0%, transparent 50%),
                linear-gradient(135deg, #f8f9fa 0%, #ffffff 50%, #f1f3f4 100%);
            color: #171717;
            line-height: 1.5;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 2.5rem; font-weight: 600; color: #171717; margin-bottom: 0.5rem; }
        .header p { color: #737373; font-size: 1.125rem; }
        .page-title { display: none; text-align: center; font-size: 1.5rem; font-weight: 600; color: #171717; margin: 1rem 0 0.5rem 0; }
        @media (max-width: 768px) {
            .header { margin-bottom: 1rem; }
            .page-title { display: block; }
        }
        .section { 
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .location { 
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            padding: 1rem;
            margin: 0.5rem 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.15s ease;
        }
        .location:hover { border-color: #d4d4d4; }
        .location-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; gap: 0.5rem; }
        .location-name { font-weight: 600; color: #171717; flex: 1 1 0; min-width: 0; overflow-wrap: break-word; }
        .location-key { font-family: ui-monospace, 'SF Mono', Monaco, monospace; background: #f5f5f5; padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.9rem; white-space: nowrap; flex-shrink: 0; }
        .hashtags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.5rem 0; }
        .hashtag { background: #e3f2fd; color: #1976d2; padding: 0.2rem 0.5rem; border-radius: 12px; font-size: 0.85rem; display: flex; align-items: center; gap: 0.3rem; }
        .hashtag .remove { cursor: pointer; color: #d32f2f; font-weight: bold; }
        .add-hashtag { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
        .add-hashtag input { 
            flex: 1;
            min-width: 0;
            padding: 0.875rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            font-size: 0.9375rem;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            transition: border-color 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }
        .add-hashtag input:focus { outline: none; border-color: #171717; }
        .add-hashtag button { 
            padding: 0.875rem 1.5rem;
            background: rgba(23, 23, 23, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        .add-hashtag button:hover { 
            background: rgba(64, 64, 64, 0.9);
            transform: translateY(-1px);
        }
        .filter { margin-bottom: 1rem; }
        .filter select { 
            padding: 0.875rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            font-size: 0.9375rem;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            transition: border-color 0.15s ease;
            margin-right: 1rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }
        .filter select:focus { outline: none; border-color: #171717; }
        .filter input { 
            padding: 0.875rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            font-size: 0.9375rem;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            transition: border-color 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }
        .filter input:focus { outline: none; border-color: #171717; }
        .graze-output { 
            background: rgba(248, 248, 248, 0.8);
            backdrop-filter: blur(20px);
            padding: 1rem;
            border-radius: 12px;
            font-family: ui-monospace, 'SF Mono', Monaco, monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }
        .stats { 
            background: rgba(240, 248, 255, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }
        .stat { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #1976d2; }
        .stat-label { font-size: 0.9rem; color: #737373; }
        .parser-controls { margin-top: 1rem; }
        .threshold-control { display: flex; align-items: center; gap: 1rem; margin: 1rem 0; }
        .threshold-control label { font-weight: 500; }
        .threshold-control input { 
            width: 120px;
            padding: 0.875rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            font-size: 0.9375rem;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            transition: border-color 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }
        .threshold-control input:focus { outline: none; border-color: #171717; }
        .threshold-control button { 
            padding: 0.875rem 1.5rem;
            background: rgba(23, 23, 23, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }
        .threshold-control button:hover { 
            background: rgba(64, 64, 64, 0.9);
            transform: translateY(-1px);
        }
        .note { font-size: 0.9rem; color: #737373; font-style: italic; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 1rem; margin: 1rem 0; }
        .pagination button { 
            padding: 0.875rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            cursor: pointer;
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 500;
            transition: all 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }
        .pagination button:hover { 
            background: rgba(245, 245, 245, 0.8);
            transform: translateY(-1px);
        }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination .current { 
            background: rgba(23, 23, 23, 0.9);
            color: white;
            border-color: rgba(23, 23, 23, 0.9);
        }
        .results-info { text-align: center; color: #737373; margin: 1rem 0; }
        .tabs {
            display: flex;
            gap: 0;
            justify-content: center;
        }
        .tab {
            padding: 0.875rem 1.5rem;
            background: rgba(23, 23, 23, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            border: 1px solid rgba(23, 23, 23, 0.9);
            border-right: none;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            text-decoration: none;
        }
        .tab:first-child {
            border-radius: 12px 0 0 12px;
        }
        .tab:last-child {
            border-radius: 0 12px 12px 0;
            border-right: 1px solid rgba(23, 23, 23, 0.9);
        }
        .tab:hover {
            background: rgba(64, 64, 64, 0.9);
            color: white;
            z-index: 1;
        }
        .tab.active {
            background: rgba(255, 255, 255, 0.9);
            color: #171717;
            border-color: rgba(255, 255, 255, 0.9);
            z-index: 2;
        }
        .tab-text { display: inline; }
        .tab-icon { display: none; }
        @media (max-width: 768px) {
            .tab { padding: 0.75rem; }
            .tab-text { display: none; }
            .tab-icon { display: block; }
        }
        @media (max-width: 768px) {
            .threshold-control { flex-wrap: wrap; }
            .threshold-control label, .threshold-control input { flex-basis: 100%; }
            .threshold-control button { width: 100%; }
            .filter { display: flex; flex-direction: column; gap: 0.5rem; }
            .filter select, .filter input { margin-right: 0; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SkyMap Admin</h1>
            <div class="tabs" style="margin-top: 1rem;">
                <a href="/" class="tab active">
                    <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></span>
                    <span class="tab-text">Locations</span>

                    <span class="tab-text">Feeds</span>
                </a>
                <a href="/custom_node.html" class="tab">
                    <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg></span>
                    <span class="tab-text">Custom Node</span>

            </div>
        </div>

        <h2 class="page-title">Locations</h2>
        <p style="text-align: center; color: #525252; margin-bottom: 1.5rem;">Manage city locations and hashtag mappings</p>
        <div class="filter">
                <input type="text" id="searchInput" placeholder="Search cities..." style="margin-right: 1rem;">
                <select id="countryFilter">
                    <option value="">All Countries</option>
                </select>
                <select id="regionFilter">
                    <option value="">All Regions</option>
                </select>
                <select id="typeFilter">
                    <option value="">All Types</option>
                    <option value="region">Regions</option>
                    <option value="city">Cities</option>
                </select>
            </div>
            <div id="locations"></div>
            <div class="pagination">
                <button onclick="changePage(-1)" id="prevBtn">Previous</button>
                <span id="pageInfo">Page 1</span>
                <button onclick="changePage(1)" id="nextBtn">Next</button>
            </div>
            <div class="results-info" id="resultsInfo"></div>
        </div>


    </div>

    <script>
        let locations = [];
        let currentPage = 1;
        const itemsPerPage = 20;
        let filteredLocations = [];

        // Get auth credentials from browser's HTTP Basic Auth
        function getAuthHeaders() {
            // Browser will prompt for credentials and cache them
            return {
                'Content-Type': 'application/json'
            };
        }

        async function loadLocations() {
            const response = await fetch('/api/locations', {
                headers: getAuthHeaders()
            });
            locations = await response.json();
            populateFilters();
            displayLocations();
        }

        function populateFilters() {
            const regions = [...new Set(locations.map(l => l.region_name))].filter(Boolean);
            
            const regionFilter = document.getElementById('regionFilter');
            
            regions.forEach(region => {
                const option = document.createElement('option');
                option.value = region;
                option.textContent = region;
                regionFilter.appendChild(option);
            });
        }
        
        async function loadCountries() {
            const response = await fetch('/api/countries', {
                headers: getAuthHeaders()
            });
            const countries = await response.json();
            
            const countryFilter = document.getElementById('countryFilter');
            countries.forEach(country => {
                const option = document.createElement('option');
                option.value = country.country_code;
                option.textContent = country.country_name;
                countryFilter.appendChild(option);
            });
        }

        async function updateRegionFilter() {
            const countryFilter = document.getElementById('countryFilter').value;
            const regionFilter = document.getElementById('regionFilter');
            
            // Clear existing options except "All Regions"
            regionFilter.innerHTML = '<option value="">All Regions</option>';
            
            // Fetch regions for selected country
            const url = countryFilter ? `/api/regions-by-country?country=${countryFilter}` : '/api/regions-by-country';
            const response = await fetch(url, {
                headers: getAuthHeaders()
            });
            const regions = await response.json();
            
            regions.forEach(region => {
                const option = document.createElement('option');
                option.value = region.region_name;
                option.textContent = region.region_name;
                regionFilter.appendChild(option);
            });
        }

        function displayLocations() {
            const container = document.getElementById('locations');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const countryFilter = document.getElementById('countryFilter').value;
            const regionFilter = document.getElementById('regionFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;
            
            filteredLocations = locations.filter(location => {
                if (searchTerm && !location.name.toLowerCase().includes(searchTerm)) return false;
                if (countryFilter && location.country_code !== countryFilter) return false;
                if (regionFilter && location.region_name !== regionFilter) return false;
                if (typeFilter === 'region' && location.population !== null) return false;
                if (typeFilter === 'city' && location.population === null) return false;
                return true;
            });
            
            // Reset to page 1 when filtering
            currentPage = 1;
            renderPage();
        }
        
        function renderPage() {
            const container = document.getElementById('locations');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageItems = filteredLocations.slice(startIndex, endIndex);
            
            container.innerHTML = pageItems.map(location => `
                <div class="location">
                    <div class="location-header">
                        <span class="location-name">${location.name}${location.region_name ? ', ' + location.region_name : ''}</span>
                        <span class="location-key">${location.key}</span>
                    </div>
                    <div class="add-hashtag">
                        <input type="text" placeholder="Add hashtag (without #)" id="hashtag-${location.id}">
                        <button onclick="addHashtag(${location.id})">Add</button>
                    </div>
                    <div class="hashtags">
                        ${location.hashtags.map(tag => `
                            <span class="hashtag">
                                #${tag}
                                <span class="remove" onclick="removeHashtag(${location.id}, '${tag}')">×</span>
                            </span>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            
            updatePaginationControls();
        }
        
        function updatePaginationControls() {
            const totalPages = Math.ceil(filteredLocations.length / itemsPerPage);
            const startItem = (currentPage - 1) * itemsPerPage + 1;
            const endItem = Math.min(currentPage * itemsPerPage, filteredLocations.length);
            
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
            document.getElementById('resultsInfo').textContent = 
                `Showing ${startItem}-${endItem} of ${filteredLocations.length} locations`;
        }
        
        function changePage(direction) {
            const totalPages = Math.ceil(filteredLocations.length / itemsPerPage);
            const newPage = currentPage + direction;
            
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderPage();
            }
        }

        async function addHashtag(locationId) {
            const input = document.getElementById(`hashtag-${locationId}`);
            const hashtag = input.value.trim();
            
            if (!hashtag) return;
            
            const response = await fetch('/api/hashtags', {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({ locationId, hashtag })
            });
            
            const data = await response.json();
            
            if (!response.ok) {
                alert(data.error || 'Failed to add hashtag');
                return;
            }
            
            input.value = '';
            loadLocations();
        }

        async function removeHashtag(locationId, hashtag) {
            await fetch('/api/hashtags', {
                method: 'DELETE',
                headers: getAuthHeaders(),
                body: JSON.stringify({ locationId, hashtag })
            });
            
            loadLocations();
        }

        async function createAllLists() {
            if (!confirm('Create lists for all locations? This will make many API calls to Bluesky.')) {
                return;
            }
            
            const response = await fetch('/api/create-lists', {
                method: 'POST',
                headers: getAuthHeaders()
            });
            
            const result = await response.json();
            alert(result.message || 'Lists creation started');
            
            // Reload locations to show new lists
            setTimeout(() => {
                loadLocations();
            }, 2000);
        }

        async function loadRegions() {
            const response = await fetch('/api/regions');
            const regions = await response.json();
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', displayLocations);
        document.getElementById('countryFilter').addEventListener('change', function() {
            updateRegionFilter();
            displayLocations();
        });
        document.getElementById('regionFilter').addEventListener('change', displayLocations);
        document.getElementById('typeFilter').addEventListener('change', displayLocations);

        // Load data on page load
        loadCountries();
        loadLocations();
        loadRegions();
    </script>
</body>
</html>
