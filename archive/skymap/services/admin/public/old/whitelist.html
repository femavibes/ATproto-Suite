<!DOCTYPE html>
<html>
<head>
    <title>Admin Whitelist - SkyMap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { overflow-y: scroll; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: 
            radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
            radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
            radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.15) 0%, transparent 50%),
            linear-gradient(135deg, #f8f9fa 0%, #ffffff 50%, #f1f3f4 100%);
            color: #171717;
            line-height: 1.5;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 2.5rem; font-weight: 600; color: #171717; margin-bottom: 0.5rem; }
        .header p { color: #737373; font-size: 1.125rem; }
        .page-title { display: none; text-align: center; font-size: 1.5rem; font-weight: 600; color: #171717; margin: 1rem 0 0.5rem 0; }
        @media (max-width: 768px) {
            .header { margin-bottom: 1rem; }
            .page-title { display: block; }
        }
        h2 { margin-bottom: 1.5rem; font-size: 1.5rem; }
        .add-form { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
        input { padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; flex: 1; }
        button { padding: 0.75rem 1.5rem; background: #171717; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #404040; }
        button.danger { background: #dc2626; }
        button.danger:hover { background: #b91c1c; }
        .user-list { list-style: none; }
        .user-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #eee; }
        .user-info { flex: 1; }
        .user-handle { font-weight: 500; }
        .user-meta { font-size: 0.875rem; color: #737373; margin-top: 0.25rem; }
        .status { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 500; }
        .status.active { background: #dcfce7; color: #166534; }
        .status.inactive { background: #fee2e2; color: #991b1b; }
        .error { background: #fee2e2; color: #991b1b; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; }
        .success { background: #dcfce7; color: #166534; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; }
        .tabs {
            display: flex;
            gap: 0;
            justify-content: center;
        }
        .tab {
            padding: 0.875rem 1.5rem;
            background: rgba(23, 23, 23, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            border: 1px solid rgba(23, 23, 23, 0.9);
            border-right: none;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            text-decoration: none;
        }
        .tab:first-child {
            border-radius: 12px 0 0 12px;
        }
        .tab:last-child {
            border-radius: 0 12px 12px 0;
            border-right: 1px solid rgba(23, 23, 23, 0.9);
        }
        .tab:hover {
            background: rgba(64, 64, 64, 0.9);
            color: white;
            z-index: 1;
        }
        .tab.active {
            background: rgba(255, 255, 255, 0.9);
            color: #171717;
            border-color: rgba(255, 255, 255, 0.9);
            z-index: 2;
        }
        .tab-text { display: inline; }
        .tab-icon { display: none; }
        @media (max-width: 768px) {
            .tab { padding: 0.75rem; }
            .tab-text { display: none; }
            .tab-icon { display: block; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SkyMap Admin</h1>
            <div class="tabs" style="margin-top: 1rem;">
                <a href="/" class="tab"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="tab-text">Locations</span></a>
                <a href="/lists.html" class="tab"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg></span><span class="tab-text">AT Protocol Lists</span></a>
                <a href="/feeds.html" class="tab"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg></span><span class="tab-text">Feeds</span></a>
                <a href="/custom_node.html" class="tab"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg></span><span class="tab-text">Custom Node</span></a>
                <a href="/data_sources.html" class="tab"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg></span><span class="tab-text">Data Sources</span></a>
                <a href="/ingestion.html" class="tab"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></span><span class="tab-text">Ingestion</span></a>
                <a href="/whitelist.html" class="tab active"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87m-4-12a4 4 0 0 1 0 7.75"></path></svg></span><span class="tab-text">Admin Users</span></a>
            </div>
        </div>

        <h2 class="page-title">Admin Users</h2>
        <p style="text-align: center; color: #525252; margin-bottom: 1.5rem;">Manage admin whitelist for SkyMap access</p>
        
        <div style="max-width: 800px; margin: 0 auto; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 16px; padding: 2rem; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);">
        <h2>Admin Whitelist Management</h2>
        
        <div id="message"></div>
        
        <div class="add-form">
            <input type="text" id="handleInput" placeholder="Enter Bluesky handle (e.g., user.bsky.social)" />
            <button onclick="addUser()">Add User</button>
        </div>
        
        <ul class="user-list" id="userList"></ul>
    </div>

    <script>
        function showMessage(text, type = 'success') {
            const msg = document.getElementById('message');
            msg.className = type;
            msg.textContent = text;
            setTimeout(() => msg.textContent = '', 3000);
        }

        async function loadUsers() {
            try {
                const res = await fetch('/api/whitelist');
                const users = await res.json();
                
                const list = document.getElementById('userList');
                list.innerHTML = users.map(user => `
                    <li class="user-item">
                        <div class="user-info">
                            <div class="user-handle">${user.handle}</div>
                            <div class="user-meta">
                                Added: ${new Date(user.created_at).toLocaleDateString()}
                                <span class="status ${user.active ? 'active' : 'inactive'}">${user.active ? 'Active' : 'Inactive'}</span>
                            </div>
                        </div>
                        ${user.active ? 
                            `<button class="danger" onclick="removeUser('${user.handle}')">Remove</button>` :
                            `<button onclick="addUser('${user.handle}')">Reactivate</button>`
                        }
                    </li>
                `).join('');
            } catch (error) {
                showMessage('Failed to load users', 'error');
            }
        }

        async function addUser(handle) {
            const handleInput = document.getElementById('handleInput');
            const handleToAdd = handle || handleInput.value.trim();
            
            if (!handleToAdd) {
                showMessage('Please enter a handle', 'error');
                return;
            }
            
            try {
                const res = await fetch('/api/whitelist/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ handle: handleToAdd })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    showMessage(data.message);
                    handleInput.value = '';
                    loadUsers();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('Failed to add user', 'error');
            }
        }

        async function removeUser(handle) {
            if (!confirm(`Remove ${handle} from whitelist?`)) return;
            
            try {
                const res = await fetch('/api/whitelist/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ handle })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    showMessage(data.message);
                    loadUsers();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('Failed to remove user', 'error');
            }
        }

        loadUsers();
    </script>
</body>
</html>
