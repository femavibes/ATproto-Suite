<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Graze Feeds - SkyMap Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { overflow-y: scroll; }
    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: 
        radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.15) 0%, transparent 50%),
        linear-gradient(135deg, #f8f9fa 0%, #ffffff 50%, #f1f3f4 100%);
      color: #171717;
      line-height: 1.5;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }
        .header { text-align: center; margin-bottom: 2rem; }
    .header h1 { font-size: 2.5rem; font-weight: 600; color: #171717; margin-bottom: 0.5rem; }
    .header p { color: #737373; font-size: 1.125rem; }
        .page-title { display: none; text-align: center; font-size: 1.5rem; font-weight: 600; color: #171717; margin: 1rem 0 0.5rem 0; }
        @media (max-width: 768px) {
            .header { margin-bottom: 1rem; }
            .page-title { display: block; }
        }
    .section { 
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    h2 { margin-bottom: 1.5rem; font-size: 1.5rem; }
    h3 { margin-bottom: 1rem; font-size: 1.1rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
    input, select, textarea { 
      width: 100%; 
      padding: 0.875rem 1rem; 
      border: 1px solid rgba(255, 255, 255, 0.5); 
      border-radius: 12px; 
      font-size: 0.9375rem;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(20px);
      transition: border-color 0.15s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #171717; }
    .btn { 
      background: rgba(23, 23, 23, 0.9);
      backdrop-filter: blur(20px);
      color: white; 
      border: none; 
      padding: 0.875rem 1.5rem; 
      border-radius: 12px; 
      cursor: pointer; 
      font-size: 0.9375rem;
      font-weight: 500;
      transition: all 0.15s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }
    .btn:hover { 
      background: rgba(64, 64, 64, 0.9);
      transform: translateY(-1px);
    }
    .btn:disabled { 
      background: rgba(148, 163, 184, 0.9);
      cursor: not-allowed;
      transform: none;
    }
    .radio-card:hover {
      border-color: rgba(23, 23, 23, 0.3);
      background: rgba(255, 255, 255, 0.6);
    }
    .radio-card:has(input:checked) {
      border-color: rgba(23, 23, 23, 0.9);
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }
    #result { margin-top: 1rem; }
    .tabs {
      display: flex;
      gap: 0;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .tab {
      padding: 0.875rem 1.5rem;
      background: rgba(23, 23, 23, 0.9);
      backdrop-filter: blur(20px);
      color: white;
      border: 1px solid rgba(23, 23, 23, 0.9);
      border-right: none;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      text-decoration: none;
    }
    .tab:first-child {
      border-radius: 12px 0 0 12px;
    }
    .tab:last-child {
      border-radius: 0 12px 12px 0;
      border-right: 1px solid rgba(23, 23, 23, 0.9);
    }
    .tab:hover {
      background: rgba(64, 64, 64, 0.9);
      color: white;
      z-index: 1;
    }
    .tab.active {
      background: rgba(255, 255, 255, 0.9);
      color: #171717;
      border-color: rgba(255, 255, 255, 0.9);
      z-index: 2;
    }
    .tab-text { display: inline; }
    .tab-icon { display: none; }
    @media (max-width: 768px) {
      .tab { padding: 0.75rem; }
      .tab-text { display: none; }
      .tab-icon { display: block; }
    }
    .tab-text { display: inline; }
    .tab-icon { display: none; }
    @media (max-width: 768px) {
      .tab { padding: 0.75rem; }
      .tab-text { display: none; }
      .tab-icon { display: block; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>SkyMap Admin</h1>
      <div class="tabs" style="margin-top: 1rem;">
        <a href="/" class="tab">
          <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></span>
          <span class="tab-text">Locations</span>
        </a>
        <a href="/lists.html" class="tab">
          <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg></span>
          <span class="tab-text">AT Protocol Lists</span>
        </a>
        <a href="/feeds.html" class="tab active">
          <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg></span>
          <span class="tab-text">Feeds</span>
        </a>
        <a href="/custom_node.html" class="tab">
          <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg></span>
          <span class="tab-text">Custom Node</span>
        </a>
        <a href="/data_sources.html" class="tab">
          <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg></span>
          <span class="tab-text">Data Sources</span>
        </a>
        <a href="/ingestion.html" class="tab">
          <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></span>
          <span class="tab-text">Ingestion</span>
        </a>
        <a href="/whitelist.html" class="tab">
          <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87m-4-12a4 4 0 0 1 0 7.75"></path></svg></span>
          <span class="tab-text">Admin Users</span>
        </a>
      </div>
    </div>

    <h2 class="page-title">Feeds</h2>
    <p style="text-align: center; color: #525252; margin-bottom: 1.5rem;">Generate and publish feeds from location lists</p>
    <div class="section">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>Saved Feeds</h3>
        <span id="loginStatus" style="font-size: 0.9rem;"></span>
      </div>
      <div id="savedFeeds"></div>
    </div>

    <div class="section">
      <h3>1. Feed Type</h3>
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <label style="flex: 1; min-width: 200px; padding: 1rem; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 12px; cursor: pointer; transition: all 0.15s ease; display: flex; align-items: center; gap: 0.5rem;" class="radio-card">
          <input type="radio" name="feedType" value="location" checked style="width: 18px; height: 18px; cursor: pointer;"> 
          <span style="display: flex; flex-direction: column; gap: 0.25rem;">
            <span style="font-weight: 500;">Location-based feed (uses lists)</span>
            <span style="font-size: 0.8rem; color: #737373;">WIP - ignore this</span>
          </span>
        </label>
        <label style="flex: 1; min-width: 200px; padding: 1rem; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 12px; cursor: pointer; transition: all 0.15s ease; display: flex; align-items: center; gap: 0.5rem;" class="radio-card">
          <input type="radio" name="feedType" value="hashtag" style="width: 18px; height: 18px; cursor: pointer;"> 
          <span style="display: flex; flex-direction: column; gap: 0.25rem;">
            <span style="font-weight: 500;">Custom hashtag feed (all hashtags from all locations)</span>
            <span style="font-size: 0.8rem; color: #737373;">Takes all hashtag mappings for all cities and makes a feed. The purpose of this is to use this feed for Contrails websocket to ingest a feed of just location posts that we can parse and use for the heatmap on our frontend. Yeah, I thought this was pretty big brain too and the least expensive way to get this data.</span>
          </span>
        </label>
      </div>
    </div>

    <div class="section" id="locationSection">
      <h3>2. Select Location</h3>
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap;">
        <select id="countryFilter" style="flex: 1; min-width: 150px; padding: 0.875rem 1rem; border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 12px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px);">
          <option value="">All Countries</option>
        </select>
        <select id="regionFilter" style="flex: 1; min-width: 150px; padding: 0.875rem 1rem; border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 12px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px);">
          <option value="">All Regions</option>
        </select>
        <input type="text" id="locationSearch" placeholder="Search locations..." style="flex: 2; min-width: 200px; padding: 0.875rem 1rem; border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 12px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px);">
      </div>
      <div class="form-group">
        <label>Select Location:</label>
        <select id="locationSelect">
          <option value="">Select a location...</option>
        </select>
      </div>
    </div>

    <div class="section">
      <h3 id="detailsTitle">4. Feed Details</h3>
      <div class="form-group">
        <label>Display Name:</label>
        <input type="text" id="displayName" placeholder="e.g., New York Feed">
      </div>
      <div class="form-group">
        <label>Description (optional):</label>
        <textarea id="description" rows="3" placeholder="Feed description"></textarea>
      </div>
      <div class="form-group">
        <label>Sticky Type:</label>
        <select id="stickyType">
          <option value="new">New</option>
          <option value="hot">Hot</option>
          <option value="top">Top</option>
        </select>
      </div>
      <div class="form-group">
        <label>Existing Feed ID (leave empty to create new):</label>
        <input type="text" id="feedId" placeholder="e.g., 31909">
      </div>
    </div>

    <div class="section">
      <h3 id="actionTitle">5. Save or Publish</h3>
      <div style="display: flex; gap: 1rem;">
        <button id="saveFeedBtn" class="btn" disabled>Save as Draft</button>
        <button id="publishFeedBtn" class="btn" disabled>Publish Feed</button>
      </div>
      <div id="result"></div>
    </div>
  </div>

  <script src="/graze-session.js"></script>
  <script>
    
    let locations = [];

    // Feed type toggle
    document.querySelectorAll('input[name="feedType"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const isLocation = e.target.value === 'location';
        document.getElementById('locationSection').style.display = isLocation ? 'block' : 'none';
        updateStepNumbers();
      });
    });

    function updateStepNumbers() {
      const isLocation = document.querySelector('input[name="feedType"]:checked').value === 'location';
      document.getElementById('detailsTitle').textContent = isLocation ? '4. Feed Details' : '3. Feed Details';
      document.getElementById('actionTitle').textContent = isLocation ? '5. Save or Publish' : '4. Save or Publish';
    }

    let allLocations = [];
    
    async function loadLocations() {
      const response = await fetch('/api/locations');
      allLocations = await response.json();
      
      // Populate country filter
      const countries = new Set();
      allLocations.forEach(l => {
        if (l.country_code) countries.add(l.country_code);
        else countries.add('US'); // null country_code = US
      });
      const countryFilter = document.getElementById('countryFilter');
      [...countries].sort().forEach(code => {
        const option = document.createElement('option');
        option.value = code;
        option.textContent = code === 'US' ? 'United States' : code === 'CA' ? 'Canada' : code;
        countryFilter.appendChild(option);
      });
      
      updateLocationList();
    }
    
    function updateLocationList() {
      const countryFilter = document.getElementById('countryFilter').value;
      const regionFilter = document.getElementById('regionFilter').value;
      const searchTerm = document.getElementById('locationSearch').value.toLowerCase();
      
      let filtered = allLocations.filter(loc => loc.population); // Only cities
      
      if (countryFilter) {
        filtered = filtered.filter(loc => 
          (loc.country_code === countryFilter) || 
          (countryFilter === 'US' && !loc.country_code)
        );
      }
      if (regionFilter) {
        filtered = filtered.filter(loc => loc.region_name === regionFilter);
      }
      if (searchTerm) {
        filtered = filtered.filter(loc => 
          loc.name.toLowerCase().includes(searchTerm) || 
          loc.region_name.toLowerCase().includes(searchTerm)
        );
      }
      
      const select = document.getElementById('locationSelect');
      
      if (filtered.length === 0) {
        select.innerHTML = '<option value="">No locations found</option>';
        return;
      }
      
      select.innerHTML = `<option value="">Select a location... (${filtered.length} found)</option>`;
      
      filtered.forEach(loc => {
        const option = document.createElement('option');
        option.value = loc.id;
        option.textContent = `${loc.name}, ${loc.region_name} (${loc.lists.length} lists)`;
        option.dataset.lists = JSON.stringify(loc.lists);
        option.dataset.name = loc.name;
        select.appendChild(option);
      });
    }
    
    function updateRegionFilter() {
      const countryFilter = document.getElementById('countryFilter').value;
      const regionFilter = document.getElementById('regionFilter');
      
      let filtered = allLocations;
      if (countryFilter) {
        filtered = filtered.filter(loc => 
          (loc.country_code === countryFilter) || 
          (countryFilter === 'US' && !loc.country_code)
        );
      }
      
      const regions = [...new Set(filtered.map(loc => loc.region_name))].sort();
      regionFilter.innerHTML = '<option value="">All Regions</option>';
      regions.forEach(region => {
        const option = document.createElement('option');
        option.value = region;
        option.textContent = region;
        regionFilter.appendChild(option);
      });
      
      updateLocationList();
    }
    
    document.getElementById('countryFilter').addEventListener('change', updateRegionFilter);
    document.getElementById('regionFilter').addEventListener('change', updateLocationList);
    document.getElementById('locationSearch').addEventListener('input', updateLocationList);

    // Graze login


    // Feed action handler
    async function handleFeedAction(publish) {
      const feedType = document.querySelector('input[name="feedType"]:checked').value;
      const displayName = document.getElementById('displayName').value.trim();
      const description = document.getElementById('description').value.trim();
      const stickyType = document.getElementById('stickyType').value;
      const feedId = document.getElementById('feedId').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!displayName) {
        resultDiv.innerHTML = '<p style="color: red;">Please enter a display name</p>';
        return;
      }
      
      let listUrls = [];
      let useHashtagManifest = false;
      
      if (feedType === 'location') {
        const locationId = document.getElementById('locationSelect').value;
        if (!locationId) {
          resultDiv.innerHTML = '<p style="color: red;">Please select a location</p>';
          return;
        }
        
        const select = document.getElementById('locationSelect');
        const option = select.options[select.selectedIndex];
        const lists = JSON.parse(option.dataset.lists);
        
        if (lists.length === 0) {
          resultDiv.innerHTML = '<p style="color: red;">This location has no lists</p>';
          return;
        }
        
        listUrls = lists.map(l => l.url);
      } else {
        useHashtagManifest = true;
      }
      
      const saveBtn = document.getElementById('saveFeedBtn');
      const publishBtn = document.getElementById('publishFeedBtn');
      saveBtn.disabled = true;
      publishBtn.disabled = true;
      
      const action = publish ? 'Publishing' : 'Saving';
      resultDiv.innerHTML = `<p>${action} feed...</p>`;
      
      try {
        const response = await fetch('/api/graze-feed', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionCookie: GrazeSession.sessionCookie,
            feedId: feedId || null,
            displayName,
            description,
            stickyType,
            listUrls,
            publish,
            useHashtagManifest
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          resultDiv.innerHTML = `
            <div style="color: green;">
              <p>✓ Feed ${publish ? 'published' : 'saved'} successfully!</p>
              <p><strong>Feed ID:</strong> ${data.feedId}</p>
              <p><strong>Algorithm URI:</strong> ${data.algorithmUri || 'N/A'}</p>
              <p><strong>Status:</strong> ${publish ? 'Published ✓' : 'Draft (unpublished)'}</p>
              <p><a href="https://www.graze.social/feed/${data.feedId}/view" target="_blank">View on Graze →</a></p>
            </div>
          `;
          if (!feedId) {
            document.getElementById('feedId').value = data.feedId;
          }
        } else {
          resultDiv.innerHTML = `<p style="color: red;">✗ Error: ${data.error}</p>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<p style="color: red;">✗ Error: ${error.message}</p>`;
      } finally {
        saveBtn.disabled = false;
        publishBtn.disabled = false;
      }
    }

    document.getElementById('saveFeedBtn').addEventListener('click', () => handleFeedAction(false));
    document.getElementById('publishFeedBtn').addEventListener('click', () => handleFeedAction(true));

    // Load saved feeds
    async function loadSavedFeeds() {
      try {
        const response = await fetch('/api/graze-feeds');
        const feeds = await response.json();
        
        const container = document.getElementById('savedFeeds');
        if (feeds.length === 0) {
          container.innerHTML = '<p style="color: #737373;">No saved feeds yet.</p>';
          return;
        }
        
        container.innerHTML = feeds.map(feed => `
          <div style="background: #f5f5f5; padding: 1rem; margin-bottom: 0.5rem; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;">
            <div>
              <strong>${feed.display_name}</strong>
              <div style="font-size: 0.875rem; color: #737373;">
                Feed ID: ${feed.graze_feed_id} | ${feed.is_hashtag_feed ? 'Hashtag Feed' : 'Location Feed'} | ${feed.published ? '✓ Published' : 'Draft'}
              </div>
            </div>
            <div style="display: flex; gap: 0.5rem;">
              <button class="btn" style="padding: 0.5rem 1rem; font-size: 0.875rem;" 
                data-feed-id="${feed.graze_feed_id}" 
                data-display-name="${feed.display_name}" 
                data-is-hashtag="${feed.is_hashtag_feed}" 
                onclick="loadFeed(this.dataset.feedId, this.dataset.displayName, this.dataset.isHashtag === 'true')">Load</button>
              <button class="btn" style="padding: 0.5rem 1rem; font-size: 0.875rem; background: #dc2626;" 
                onclick="deleteFeed('${feed.graze_feed_id}', '${feed.display_name}')">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading feeds:', error);
      }
    }

    // Load feed into form
    window.loadFeed = function(feedId, displayName, isHashtagFeed) {
      document.getElementById('feedId').value = feedId;
      document.getElementById('displayName').value = displayName;
      
      // Set feed type
      const feedType = isHashtagFeed ? 'hashtag' : 'location';
      document.querySelector(`input[name="feedType"][value="${feedType}"]`).checked = true;
      document.getElementById('locationSection').style.display = isHashtagFeed ? 'none' : 'block';
      updateStepNumbers();
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // Delete feed from database
    window.deleteFeed = async function(feedId, displayName) {
      if (!confirm(`Delete feed "${displayName}"?\n\nThis will only remove it from the database, not from Graze.`)) {
        return;
      }
      
      try {
        const response = await fetch(`/api/graze-feeds/${feedId}`, {
          method: 'DELETE'
        });
        
        const result = await response.json();
        
        if (result.success) {
          alert('Feed deleted from database');
          loadSavedFeeds();
        } else {
          alert('Error: ' + result.error);
        }
      } catch (error) {
        alert('Error deleting feed: ' + error.message);
      }
    };

    // Initialize
    loadLocations();
    loadSavedFeeds();
  </script>
  </div>
</body>
</html>
