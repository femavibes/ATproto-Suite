<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - SkyMap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f5f5;
            color: #171717;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-box { 
            background: white;
            
            border: 1px solid #ddd;
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { 
            font-size: 2rem; 
            font-weight: 600; 
            color: #171717; 
            margin-bottom: 0.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .header h1 svg { width: 2rem; height: 2rem; }
        .header p { color: #737373; font-size: 0.9375rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { 
            display: block; 
            margin-bottom: 0.5rem; 
            font-weight: 500;
            color: #171717;
            font-size: 0.9375rem;
        }
        input { 
            width: 100%; 
            padding: 0.875rem 1rem;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 0.9375rem;
            background: white;
            
            transition: border-color 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }
        input:focus { outline: none; border-color: #171717; }
        button { 
            width: 100%; 
            padding: 0.875rem 1.5rem;
            background: #333;
            
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-top: 1rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }
        button:hover { 
            background: #555;
            transform: translateY(-1px);
        }
        button:disabled { 
            background: #aaa;
            cursor: not-allowed;
            transform: none;
        }
        .error { 
            background: rgba(254, 226, 226, 0.8);
            
            color: #991b1b; 
            padding: 0.875rem; 
            border-radius: 12px; 
            margin-bottom: 1.25rem;
            font-size: 0.9375rem;
            border: 1px solid rgba(220, 38, 38, 0.2);
        }
        .note { 
            font-size: 0.875rem; 
            color: #737373; 
            text-align: center; 
            margin-top: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="header">
            <h1>
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="2" fill="currentColor"/>
                </svg>
                ATlas Admin
            </h1>
            <p>Sign in to continue</p>
        </div>
        <div id="error"></div>
        <form onsubmit="login(event)">
            <div class="form-group">
                <label>Bluesky Handle</label>
                <input type="text" id="handle" placeholder="user.bsky.social" required autofocus />
            </div>
            <div class="form-group">
                <label>App Password</label>
                <input type="password" id="password" placeholder="xxxx-xxxx-xxxx-xxxx" required />
            </div>
            <button type="submit" id="loginBtn">Sign In</button>
        </form>
        <p class="note">Use your Bluesky handle and app password</p>
    </div>

    <script>
        async function login(e) {
            e.preventDefault();
            
            const handle = document.getElementById('handle').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('error');
            
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            errorDiv.textContent = '';
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ handle, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = data.error || 'Login failed';
                    errorDiv.className = 'error';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                }
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.className = 'error';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        }
    </script>
</body>
</html>
