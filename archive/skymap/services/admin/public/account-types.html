<div id="accountTypesRoot">
  <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
    <button class="at-sub-btn active" onclick="switchATSub('manage')" style="padding:0.4rem 0.75rem; background:#333; color:white; border:none; border-radius:4px; cursor:pointer; font-size:0.85rem;">Manage Types</button>
    <button class="at-sub-btn" onclick="switchATSub('assign')" style="padding:0.4rem 0.75rem; background:#eee; border:none; border-radius:4px; cursor:pointer; font-size:0.85rem; color:#525252;">Assign to Accounts</button>
    <button class="at-sub-btn" onclick="switchATSub('browse')" style="padding:0.4rem 0.75rem; background:#eee; border:none; border-radius:4px; cursor:pointer; font-size:0.85rem; color:#525252;">Browse Assignments</button>
    <button class="at-sub-btn" onclick="switchATSub('import')" style="padding:0.4rem 0.75rem; background:#eee; border:none; border-radius:4px; cursor:pointer; font-size:0.85rem; color:#525252;">Import from List</button>
  </div>

  <!-- Manage Types sub-tab -->
  <div id="atSubManage">
    <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
      <button onclick="showCreateTypeForm()" style="padding:0.4rem 0.75rem; font-size:0.85rem;">+ New Type</button>
    </div>
    <div id="createTypeForm" style="display:none; background:#f9f9f9; border:1px solid #ddd; border-radius:6px; padding:1rem; margin-bottom:1rem;">
      <div style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:end;">
        <div><label style="font-size:0.8rem; color:#666;">Key</label><br><input id="newTypeKey" placeholder="e.g. news_org" style="padding:0.4rem; border:1px solid #ccc; border-radius:4px; width:150px;"></div>
        <div><label style="font-size:0.8rem; color:#666;">Display Name</label><br><input id="newTypeName" placeholder="e.g. News Organization" style="padding:0.4rem; border:1px solid #ccc; border-radius:4px; width:200px;"></div>
        <div><label style="font-size:0.8rem; color:#666;">Auto-add Interests</label><br><select id="newTypeInterests" multiple style="padding:0.4rem; border:1px solid #ccc; border-radius:4px; min-width:200px; height:80px;"></select></div>
        <button onclick="createType()" style="padding:0.4rem 0.75rem; font-size:0.85rem;">Create</button>
        <button onclick="document.getElementById('createTypeForm').style.display='none'" style="padding:0.4rem 0.75rem; font-size:0.85rem; background:#999;">Cancel</button>
      </div>
    </div>
    <table id="typesTable" style="width:100%; border-collapse:collapse; font-size:0.85rem;">
      <thead><tr style="border-bottom:2px solid #ddd; text-align:left;">
        <th style="padding:0.5rem;">Key</th><th style="padding:0.5rem;">Name</th><th style="padding:0.5rem;">Auto Interests</th><th style="padding:0.5rem;">Accounts</th><th style="padding:0.5rem;">Active</th><th style="padding:0.5rem;">Actions</th>
      </tr></thead>
      <tbody id="typesBody"></tbody>
    </table>
  </div>

  <!-- Assign sub-tab -->
  <div id="atSubAssign" style="display:none;">
    <div style="background:#f9f9f9; border:1px solid #ddd; border-radius:6px; padding:1rem; margin-bottom:1rem;">
      <div style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:end;">
        <div><label style="font-size:0.8rem; color:#666;">Handle or DID</label><br><input id="assignInput" placeholder="@handle or did:plc:..." style="padding:0.4rem; border:1px solid #ccc; border-radius:4px; width:250px;"></div>
        <div><label style="font-size:0.8rem; color:#666;">Account Type</label><br><select id="assignTypeSelect" style="padding:0.4rem; border:1px solid #ccc; border-radius:4px;"></select></div>
        <div><label style="font-size:0.8rem; color:#666;">Notes (optional)</label><br><input id="assignNotes" placeholder="" style="padding:0.4rem; border:1px solid #ccc; border-radius:4px; width:200px;"></div>
        <button onclick="assignType()" style="padding:0.4rem 0.75rem; font-size:0.85rem;">Assign</button>
      </div>
      <div id="assignResult" style="margin-top:0.5rem; font-size:0.85rem;"></div>
    </div>
    <div style="margin-bottom:0.5rem; font-size:0.85rem; color:#666;">Look up account types:</div>
    <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
      <input id="lookupInput" placeholder="@handle or did:plc:..." style="padding:0.4rem; border:1px solid #ccc; border-radius:4px; width:250px;">
      <button onclick="lookupAccount()" style="padding:0.4rem 0.75rem; font-size:0.85rem;">Look Up</button>
    </div>
    <div id="lookupResult"></div>
  </div>

  <!-- Browse sub-tab -->
  <div id="atSubBrowse" style="display:none;">
    <div style="display:flex; gap:0.5rem; margin-bottom:1rem; align-items:end;">
      <div><label style="font-size:0.8rem; color:#666;">Filter by Type</label><br><select id="browseTypeFilter" onchange="loadAssignments()" style="padding:0.4rem; border:1px solid #ccc; border-radius:4px;"><option value="">All</option></select></div>
      <div style="flex:1;"><label style="font-size:0.8rem; color:#666;">Search</label><br><input id="browseSearch" placeholder="Handle or DID..." oninput="filterBrowseRows()" style="padding:0.4rem; border:1px solid #ccc; border-radius:4px; width:100%; box-sizing:border-box;"></div>
    </div>
    <div id="assignmentsCount" style="font-size:0.85rem; color:#666; margin-bottom:0.5rem;"></div>
    <table style="width:100%; border-collapse:collapse; font-size:0.85rem;">
      <thead><tr style="border-bottom:2px solid #ddd; text-align:left;">
        <th style="padding:0.5rem;">Account</th><th style="padding:0.5rem;">Type</th><th style="padding:0.5rem;">Added</th><th style="padding:0.5rem;">By</th><th style="padding:0.5rem;">Notes</th><th style="padding:0.5rem;">Actions</th>
      </tr></thead>
      <tbody id="assignmentsBody"></tbody>
    </table>
    <div id="assignmentsPager" style="margin-top:0.5rem; display:flex; gap:0.5rem;"></div>
  </div>

  <!-- Import from List sub-tab -->
  <div id="atSubImport" style="display:none;">
    <div style="background:#f9f9f9; border:1px solid #ddd; border-radius:6px; padding:1rem; margin-bottom:1rem;">
      <div style="display:flex; gap:0.5rem; align-items:end;">
        <div style="flex:1;"><label style="font-size:0.8rem; color:#666;">Bluesky List URL</label><br><input id="importListUrl" placeholder="https://bsky.app/profile/.../lists/..." style="padding:0.4rem; border:1px solid #ccc; border-radius:4px; width:100%; box-sizing:border-box;"></div>
        <button onclick="fetchImportList()" style="padding:0.4rem 0.75rem; font-size:0.85rem;">Fetch</button>
      </div>
      <div id="importStatus" style="margin-top:0.5rem; font-size:0.85rem;"></div>
    </div>
    <div id="importTable"></div>
  </div>
</div>

<script>
(function() {
  let allTypes = [];
  let allInterests = [];
  let interestNames = {};
  let browseOffset = 0;

  function switchATSub(sub) {
    document.querySelectorAll('#accountTypesRoot .at-sub-btn').forEach(b => {
      b.classList.remove('active');
      b.style.background = '#eee'; b.style.color = '#525252';
    });
    event.target.classList.add('active');
    event.target.style.background = '#333'; event.target.style.color = 'white';
    document.getElementById('atSubManage').style.display = sub === 'manage' ? '' : 'none';
    document.getElementById('atSubAssign').style.display = sub === 'assign' ? '' : 'none';
    document.getElementById('atSubBrowse').style.display = sub === 'browse' ? '' : 'none';
    document.getElementById('atSubImport').style.display = sub === 'import' ? '' : 'none';
    if (sub === 'browse') { browseOffset = 0; loadAssignments(); }
  }
  window.switchATSub = switchATSub;

  async function loadTypes() {
    const resp = await fetch('/api/account-types');
    const data = await resp.json();
    allTypes = data.types;
    interestNames = data.interestNames || {};
    renderTypes();
    populateTypeSelects();
  }

  async function loadInterests() {
    const resp = await fetch('/api/interests/all');
    allInterests = await resp.json();
    populateInterestSelect('newTypeInterests');
  }

  function populateInterestSelect(selectId) {
    const sel = document.getElementById(selectId);
    if (!sel) return;
    sel.innerHTML = '';
    for (const i of allInterests) {
      const opt = document.createElement('option');
      opt.value = i.id; opt.textContent = i.name;
      sel.appendChild(opt);
    }
  }

  function populateTypeSelects() {
    const active = allTypes.filter(t => t.active);
    for (const selId of ['assignTypeSelect', 'browseTypeFilter']) {
      const sel = document.getElementById(selId);
      if (!sel) continue;
      const currentVal = sel.value;
      if (selId === 'browseTypeFilter') {
        sel.innerHTML = '<option value="">All</option>';
      } else {
        sel.innerHTML = '';
      }
      for (const t of active) {
        const opt = document.createElement('option');
        opt.value = t.id; opt.textContent = t.name;
        sel.appendChild(opt);
      }
      if (currentVal) sel.value = currentVal;
    }
  }

  function renderTypes() {
    const tbody = document.getElementById('typesBody');
    tbody.innerHTML = '';
    for (const t of allTypes) {
      const interestBadges = (t.interest_ids || []).map(id => {
        const name = interestNames[id] || `#${id}`;
        return `<span style="display:inline-flex;align-items:center;gap:0.2rem;padding:0.1rem 0.4rem;background:#e8e8e8;border-radius:3px;margin:0.1rem;font-size:0.78rem;">${name}<button onclick="removeAutoInterest(${t.id},${id})" style="background:none;border:none;cursor:pointer;font-size:0.85rem;color:#999;padding:0;line-height:1;" title="Remove">&times;</button></span>`;
      }).join('') || '<span style="color:#999;font-size:0.78rem;">None</span>';
      const tr = document.createElement('tr');
      tr.style.borderBottom = '1px solid #eee';
      tr.innerHTML = `
        <td style="padding:0.5rem; font-family:monospace; font-size:0.8rem;">${t.key}</td>
        <td style="padding:0.5rem;" id="type-name-${t.id}">${t.name}</td>
        <td style="padding:0.5rem;">${interestBadges} <button onclick="showAddInterest(${t.id})" style="padding:0.1rem 0.3rem;font-size:0.75rem;background:#eee;border:1px solid #ccc;border-radius:3px;cursor:pointer;">+</button><span id="add-interest-${t.id}"></span></td>
        <td style="padding:0.5rem;">${t.assignment_count}</td>
        <td style="padding:0.5rem;">${t.active ? 'Yes' : 'No'}</td>
        <td style="padding:0.5rem;">
          <button onclick="editTypeName(${t.id})" style="padding:0.25rem 0.5rem; font-size:0.8rem;">Rename</button>
        </td>
      `;
      tbody.appendChild(tr);
    }
  }

  window.showCreateTypeForm = function() {
    document.getElementById('createTypeForm').style.display = '';
    document.getElementById('newTypeKey').value = '';
    document.getElementById('newTypeName').value = '';
    document.getElementById('newTypeInterests').selectedIndex = -1;
  };

  window.createType = async function() {
    const key = document.getElementById('newTypeKey').value.trim();
    const name = document.getElementById('newTypeName').value.trim();
    const sel = document.getElementById('newTypeInterests');
    const interest_ids = [...sel.selectedOptions].map(o => parseInt(o.value));
    if (!key || !name) return alert('Key and name required');
    const resp = await fetch('/api/account-types', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ key, name, interest_ids })
    });
    if (!resp.ok) { const e = await resp.json(); return alert(e.error); }
    document.getElementById('createTypeForm').style.display = 'none';
    loadTypes();
  };

  window.editTypeName = async function(id) {
    const t = allTypes.find(x => x.id === id);
    if (!t) return;
    const name = prompt('Display name:', t.name);
    if (name === null || !name.trim()) return;
    const resp = await fetch(`/api/account-types/${id}`, {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name: name.trim() })
    });
    if (!resp.ok) { const e = await resp.json(); return alert(e.error); }
    loadTypes();
  };

  window.removeAutoInterest = async function(typeId, interestId) {
    const t = allTypes.find(x => x.id === typeId);
    if (!t) return;
    const newIds = (t.interest_ids || []).filter(id => id !== interestId);
    const resp = await fetch(`/api/account-types/${typeId}`, {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ interest_ids: newIds })
    });
    if (!resp.ok) { const e = await resp.json(); return alert(e.error); }
    loadTypes();
  };

  window.showAddInterest = function(typeId) {
    const t = allTypes.find(x => x.id === typeId);
    if (!t) return;
    const span = document.getElementById('add-interest-' + typeId);
    const existing = new Set(t.interest_ids || []);
    const available = allInterests.filter(i => !existing.has(i.id));
    if (available.length === 0) { span.innerHTML = ' <span style="font-size:0.75rem;color:#999;">All interests added</span>'; return; }
    let h = ' <select id="add-interest-sel-' + typeId + '" style="font-size:0.78rem;padding:0.15rem;border:1px solid #ccc;border-radius:3px;">';
    for (const i of available) h += '<option value="' + i.id + '">' + i.name + '</option>';
    h += '</select> <button onclick="addAutoInterest(' + typeId + ')" style="padding:0.1rem 0.3rem;font-size:0.75rem;">Add</button>';
    span.innerHTML = h;
  };

  window.addAutoInterest = async function(typeId) {
    const t = allTypes.find(x => x.id === typeId);
    if (!t) return;
    const sel = document.getElementById('add-interest-sel-' + typeId);
    const newId = parseInt(sel.value);
    const newIds = [...(t.interest_ids || []), newId];
    const resp = await fetch(`/api/account-types/${typeId}`, {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ interest_ids: newIds })
    });
    if (!resp.ok) { const e = await resp.json(); return alert(e.error); }
    loadTypes();
  };

  window.assignType = async function() {
    const input = document.getElementById('assignInput').value.trim();
    const typeId = document.getElementById('assignTypeSelect').value;
    const notes = document.getElementById('assignNotes').value.trim();
    if (!input || !typeId) return alert('Handle/DID and type required');
    const body = { account_type_id: parseInt(typeId), notes: notes || undefined };
    if (input.startsWith('did:')) body.did = input;
    else body.handle = input;

    const resultDiv = document.getElementById('assignResult');
    resultDiv.textContent = 'Assigning...';
    const resp = await fetch('/api/account-type-assignments', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    if (!resp.ok) { resultDiv.textContent = 'Error: ' + data.error; return; }
    resultDiv.textContent = `Assigned to ${data.did}` + (data.interests_added > 0 ? ` (${data.interests_added} interest(s) auto-added)` : '');
    document.getElementById('assignInput').value = '';
    document.getElementById('assignNotes').value = '';
  };

  window.lookupAccount = async function() {
    const input = document.getElementById('lookupInput').value.trim();
    if (!input) return;
    let did = input;
    if (!input.startsWith('did:')) {
      const handle = input.replace(/^@/, '');
      try {
        const resp = await fetch(`https://public.api.bsky.app/xrpc/com.atproto.identity.resolveHandle?handle=${encodeURIComponent(handle)}`);
        if (resp.ok) { did = (await resp.json()).did; }
        else { document.getElementById('lookupResult').innerHTML = '<span style="color:#c00;">Could not resolve handle</span>'; return; }
      } catch(e) { document.getElementById('lookupResult').innerHTML = '<span style="color:#c00;">Error resolving handle</span>'; return; }
    }
    const resp = await fetch(`/api/account-types/for-did/${encodeURIComponent(did)}`);
    const types = await resp.json();
    const div = document.getElementById('lookupResult');
    if (types.length === 0) {
      div.innerHTML = `<div style="font-size:0.85rem; padding:0.5rem; background:#f9f9f9; border-radius:4px;">${did}<br>No account types assigned</div>`;
      return;
    }
    let html = `<div style="font-size:0.85rem; padding:0.5rem; background:#f9f9f9; border-radius:4px;"><strong>${did}</strong><br>`;
    for (const t of types) {
      html += `<span style="display:inline-block; padding:0.15rem 0.5rem; background:#e0e0e0; border-radius:3px; margin:0.2rem; font-size:0.8rem;">${t.name}</span>
        <button onclick="removeAssignment('${did}', ${t.id})" style="padding:0.15rem 0.4rem; font-size:0.75rem; background:#c00; color:white; border:none; border-radius:3px; cursor:pointer;">Remove</button> `;
    }
    html += '</div>';
    div.innerHTML = html;
  };

  window.removeAssignment = async function(did, typeId) {
    if (!confirm('Remove this type assignment?')) return;
    await fetch('/api/account-type-assignments', {
      method: 'DELETE', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ did, account_type_id: typeId })
    });
    lookupAccount();
  };

  async function loadAssignments() {
    const typeId = document.getElementById('browseTypeFilter').value;
    const params = new URLSearchParams({ limit: '50', offset: String(browseOffset) });
    if (typeId) params.set('type_id', typeId);
    const resp = await fetch('/api/account-type-assignments?' + params);
    const data = await resp.json();
    document.getElementById('assignmentsCount').textContent = `${data.total} assignment(s)`;

    const tbody = document.getElementById('assignmentsBody');
    tbody.innerHTML = '';

    // Batch resolve handles
    const dids = [...new Set(data.assignments.map(a => a.did))];
    const handleMap = {};
    if (dids.length > 0) {
      // Try Bluesky API in batches of 25
      for (let i = 0; i < dids.length; i += 25) {
        const batch = dids.slice(i, i + 25);
        try {
          const params = batch.map(d => 'actors=' + encodeURIComponent(d)).join('&');
          const r = await fetch(`https://public.api.bsky.app/xrpc/app.bsky.actor.getProfiles?${params}`);
          if (r.ok) {
            const profiles = await r.json();
            for (const p of profiles.profiles || []) handleMap[p.did] = p.handle;
          }
        } catch(e) {}
      }
    }

    for (const a of data.assignments) {
      const tr = document.createElement('tr');
      tr.style.borderBottom = '1px solid #eee';
      const handle = handleMap[a.did] || '';
      const displayName = handle ? `@${handle}` : a.did;
      tr.innerHTML = `
        <td style="padding:0.5rem;"><span style="font-size:0.8rem;">${displayName}</span><br><span style="font-size:0.7rem; color:#999;">${a.did}</span></td>
        <td style="padding:0.5rem;">${a.type_name}</td>
        <td style="padding:0.5rem; font-size:0.8rem;">${new Date(a.added_at).toLocaleDateString()}</td>
        <td style="padding:0.5rem; font-size:0.8rem;">${a.added_by || ''}</td>
        <td style="padding:0.5rem; font-size:0.8rem;">${a.notes || ''}</td>
        <td style="padding:0.5rem;">
          <button onclick="removeAssignment('${a.did}', ${a.account_type_id})" style="padding:0.25rem 0.5rem; font-size:0.8rem; background:#c00; color:white; border:none; border-radius:3px; cursor:pointer;">Remove</button>
        </td>
      `;
      tbody.appendChild(tr);
    }

    // Pager
    const pager = document.getElementById('assignmentsPager');
    pager.innerHTML = '';
    if (browseOffset > 0) {
      const prev = document.createElement('button');
      prev.textContent = 'Previous'; prev.style.cssText = 'padding:0.3rem 0.6rem; font-size:0.8rem;';
      prev.onclick = () => { browseOffset = Math.max(0, browseOffset - 50); loadAssignments(); };
      pager.appendChild(prev);
    }
    if (browseOffset + 50 < data.total) {
      const next = document.createElement('button');
      next.textContent = 'Next'; next.style.cssText = 'padding:0.3rem 0.6rem; font-size:0.8rem;';
      next.onclick = () => { browseOffset += 50; loadAssignments(); };
      pager.appendChild(next);
    }
  }
  window.loadAssignments = loadAssignments;

  window.filterBrowseRows = function() {
    const q = document.getElementById('browseSearch').value.toLowerCase();
    document.querySelectorAll('#assignmentsBody tr').forEach(function(tr) {
      tr.style.display = !q || tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  };

  // --- Import from List ---
  let importMembers = [];

  window.fetchImportList = async function() {
    const url = document.getElementById('importListUrl').value.trim();
    if (!url) return;
    const status = document.getElementById('importStatus');
    status.textContent = 'Fetching list...';

    // Convert bsky.app URL to AT URI
    let atUri = url;
    const match = url.match(/bsky\.app\/profile\/([^/]+)\/lists\/([^/]+)/);
    if (match) {
      let actor = match[1];
      // Resolve handle to DID if needed
      if (!actor.startsWith('did:')) {
        try {
          const r = await fetch(`https://public.api.bsky.app/xrpc/com.atproto.identity.resolveHandle?handle=${encodeURIComponent(actor)}`);
          if (r.ok) actor = (await r.json()).did;
        } catch(e) {}
      }
      atUri = `at://${actor}/app.bsky.graph.list/${match[2]}`;
    }

    // Fetch list members
    importMembers = [];
    let cursor = '';
    try {
      do {
        const r = await fetch(`https://public.api.bsky.app/xrpc/app.bsky.graph.getList?list=${encodeURIComponent(atUri)}&limit=100${cursor ? '&cursor=' + cursor : ''}`);
        const data = await r.json();
        if (data.items) {
          for (const item of data.items) {
            importMembers.push({
              did: item.subject.did,
              handle: item.subject.handle,
              displayName: item.subject.displayName || '',
              avatar: item.subject.avatar || '',
              selected: {},
            });
          }
        }
        cursor = data.cursor || '';
      } while (cursor);
      status.textContent = importMembers.length + ' accounts fetched';
      renderImportTable();
    } catch(e) {
      status.textContent = 'Error: ' + e.message;
    }
  };

  function renderImportTable() {
    if (importMembers.length === 0) { document.getElementById('importTable').innerHTML = ''; return; }
    const active = allTypes.filter(t => t.active);
    let h = '<div style="margin-bottom:0.5rem;display:flex;gap:0.5rem;align-items:center;">';
    h += '<button onclick="applyImport()" style="padding:0.4rem 0.75rem;font-size:0.85rem;background:#166534;color:white;border:none;border-radius:4px;cursor:pointer;">Apply Selected</button>';
    h += '<span id="importApplyStatus" style="font-size:0.8rem;color:#666;"></span>';
    h += '</div>';
    h += '<table style="width:100%;border-collapse:collapse;font-size:0.8rem;"><thead><tr style="border-bottom:2px solid #ddd;">';
    h += '<th style="padding:0.4rem;text-align:left;">Account</th>';
    for (const t of active) {
      h += '<th style="padding:0.4rem;text-align:center;font-size:0.75rem;"><input type="checkbox" onchange="toggleAllImportType(' + t.id + ', this.checked)" title="Select all"> ' + t.name + '</th>';
    }
    h += '<th style="padding:0.4rem;text-align:center;font-size:0.75rem;"><input type="checkbox" onchange="toggleAllImportSkip(this.checked)" title="Skip all"> Skip</th>';
    h += '</tr></thead><tbody>';
    importMembers.forEach(function(m, idx) {
      h += '<tr style="border-bottom:1px solid #eee;">';
      h += '<td style="padding:0.4rem;">';
      if (m.avatar) h += '<img src="' + m.avatar + '" style="width:20px;height:20px;border-radius:50%;vertical-align:middle;margin-right:0.3rem;">';
      h += '<span onclick="toggleImportPreview(' + idx + ')" style="color:#1e40af;cursor:pointer;font-size:0.8rem;">@' + m.handle + '</span>';
      h += ' <a href="https://bsky.app/profile/' + m.did + '" target="_blank" style="color:#aaa;text-decoration:none;font-size:0.65rem;">&#8599;</a>';
      if (m.displayName) h += '<div style="font-size:0.7rem;color:#888;">' + m.displayName + '</div>';
      h += '</td>';
      for (const t of active) {
        const checked = m.selected[t.id] ? ' checked' : '';
        h += '<td style="padding:0.4rem;text-align:center;"><input type="checkbox" data-idx="' + idx + '" data-type="' + t.id + '" onchange="toggleImportType(this)"' + checked + '></td>';
      }
      h += '<td style="padding:0.4rem;text-align:center;"><input type="checkbox" data-idx="' + idx + '" data-type="skip" onchange="toggleImportSkip(this)"></td>';
      h += '</tr>';
      // Preview row (hidden by default)
      var colCount = active.length + 3;
      h += '<tr id="import-preview-' + idx + '" style="display:none;"><td colspan="' + colCount + '" style="padding:0;"><div id="import-preview-content-' + idx + '" style="padding:0.75rem;background:#f8fafc;border:1px solid #e2e8f0;font-size:0.78rem;"></div></td></tr>';
    });
    h += '</tbody></table>';
    document.getElementById('importTable').innerHTML = h;
  }

  let importPreviewCache = {};

  window.toggleImportPreview = async function(idx) {
    const row = document.getElementById('import-preview-' + idx);
    if (row.style.display !== 'none') { row.style.display = 'none'; return; }
    row.style.display = '';
    const content = document.getElementById('import-preview-content-' + idx);
    const m = importMembers[idx];
    if (importPreviewCache[m.did]) { content.innerHTML = importPreviewCache[m.did]; return; }
    content.innerHTML = 'Loading...';
    try {
      const r = await fetch(`https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile?actor=${encodeURIComponent(m.did)}`);
      const p = await r.json();
      let h = '<div style="display:flex;gap:0.75rem;align-items:start;">';
      if (p.avatar) h += '<img src="' + p.avatar + '" style="width:48px;height:48px;border-radius:50%;">';
      h += '<div>';
      h += '<div style="font-weight:600;">' + (p.displayName || p.handle) + '</div>';
      h += '<div style="font-size:0.75rem;color:#888;">@' + p.handle + '</div>';
      h += '<div style="font-size:0.75rem;color:#666;margin-top:0.2rem;">' + (p.followersCount || 0).toLocaleString() + ' followers, ' + (p.followsCount || 0).toLocaleString() + ' following, ' + (p.postsCount || 0).toLocaleString() + ' posts</div>';
      if (p.description) h += '<div style="font-size:0.78rem;margin-top:0.3rem;white-space:pre-wrap;">' + p.description.slice(0, 300) + '</div>';
      h += '</div></div>';
      // Fetch recent posts
      try {
        const pr = await fetch(`https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=${encodeURIComponent(m.did)}&limit=3&filter=posts_no_replies`);
        const feed = await pr.json();
        if (feed.feed && feed.feed.length > 0) {
          h += '<div style="margin-top:0.5rem;border-top:1px solid #e2e8f0;padding-top:0.4rem;">';
          h += '<div style="font-size:0.7rem;color:#999;margin-bottom:0.3rem;">Recent posts:</div>';
          for (const item of feed.feed.slice(0, 3)) {
            const text = item.post.record?.text || '';
            h += '<div style="font-size:0.75rem;padding:0.25rem 0;border-bottom:1px solid #f0f0f0;">' + text.slice(0, 150) + (text.length > 150 ? '...' : '') + '</div>';
          }
          h += '</div>';
        }
      } catch(e) {}
      importPreviewCache[m.did] = h;
      content.innerHTML = h;
    } catch(e) { content.innerHTML = 'Error loading profile'; }
  };

  window.toggleImportType = function(cb) {
    const idx = parseInt(cb.dataset.idx);
    const typeId = parseInt(cb.dataset.type);
    importMembers[idx].selected[typeId] = cb.checked;
  };

  window.toggleImportSkip = function(cb) {
    const idx = parseInt(cb.dataset.idx);
    importMembers[idx].skip = cb.checked;
  };

  window.toggleAllImportType = function(typeId, checked) {
    importMembers.forEach(function(m, idx) {
      m.selected[typeId] = checked;
    });
    document.querySelectorAll('input[data-type="' + typeId + '"]').forEach(function(cb) { cb.checked = checked; });
  };

  window.toggleAllImportSkip = function(checked) {
    importMembers.forEach(function(m) { m.skip = checked; });
    document.querySelectorAll('input[data-type="skip"]').forEach(function(cb) { cb.checked = checked; });
  };

  window.applyImport = async function() {
    const status = document.getElementById('importApplyStatus');
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'Processing...';
    let applied = 0, skipped = 0, total = importMembers.length;
    for (let i = 0; i < importMembers.length; i++) {
      const m = importMembers[i];
      if (m.skip) { skipped++; continue; }
      const typeIds = Object.entries(m.selected).filter(([k, v]) => v).map(([k]) => parseInt(k));
      if (typeIds.length === 0) { skipped++; continue; }
      for (const typeId of typeIds) {
        try {
          await fetch('/api/account-type-assignments', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ did: m.did, account_type_id: typeId, added_by: 'list_import' })
          });
          applied++;
        } catch(e) {}
      }
      status.textContent = 'Processing ' + (i + 1) + '/' + total + '...';
    }
    btn.disabled = false;
    btn.textContent = 'Apply Selected';
    status.textContent = applied + ' assignments applied, ' + skipped + ' skipped';
    loadTypes();
  };

  // Init
  loadTypes();
  loadInterests();
})();
</script>
