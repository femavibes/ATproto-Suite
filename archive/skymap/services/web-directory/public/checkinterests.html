<div class="section">
    <div id="myInterestsSection" style="display: none;">
        <div class="section-title">My Interests</div>
        <div id="myInterestsAuth" style="display: none;">
            <p class="section-desc">Login to view and manage your interests</p>
        </div>
        <div id="myInterestsContent" style="display: none;">
            <p class="section-desc">Your active interests (<span id="myInterestCountCheck">0</span>/15).</p>
            <div id="myInterestsListCheck"></div>
        </div>
        <div class="section-title" style="margin-top: 2rem;">Check Other Users</div>
    </div>
    <div id="checkInterestsSection">
        <!-- Title removed - modal header already shows "Check Interests" -->
    </div>
    <p class="section-desc" id="checkInterestsDescription">View and manage your interests or view another user's interests. Log in for easier management and additional features.</p>
    
    <div class="search-grid">
        <input type="text" id="handleInputInterests" placeholder="username.bsky.social" />
        <button onclick="checkUserInterests()">Check</button>
    </div>
    <div id="userInterests"></div>
</div>

<script>
async function checkUserInterests() {
    const handle = document.getElementById('handleInputInterests').value.trim();
    if (!handle) return;
    
    const userInterestsDiv = document.getElementById('userInterests');
    userInterestsDiv.innerHTML = '<div class="loading">Loading...</div>';
    
    try {
        // First resolve handle to DID
        const resolveResponse = await fetch(`https://public.api.bsky.app/xrpc/com.atproto.identity.resolveHandle?handle=${encodeURIComponent(handle)}`);
        if (!resolveResponse.ok) {
            throw new Error('User not found');
        }
        const resolveData = await resolveResponse.json();
        const did = resolveData.did;
        
        // Then fetch interests
        const response = await fetch(`/api/interests/user/${encodeURIComponent(did)}`);
        const interests = await response.json();
        
        if (!response.ok) {
            throw new Error(interests.error || 'Failed to fetch interests');
        }
        
        const count = interests.length;
        
        let html = `<div style="margin-bottom: 1.5rem;"><h3 style="font-size: 1rem; font-weight: 500; margin-bottom: 0.75rem;">Interests (${count}/15)</h3>`;
        if (count === 0) {
            html += '<div class="empty-state">No interests found</div>';
        } else {
            html += interests.map(interest => `
                <div class="user-label">
                    <div>
                        <h4>${interest.name}</h4>
                        <span class="location-key">${interest.key}</span>
                    </div>
                    <button class="btn-sm btn-secondary" onclick="openBlueskyRemoveInterest('${interest.key}')">Remove</button>
                </div>
            `).join('');
        }
        html += '</div>';
        
        userInterestsDiv.innerHTML = html;
    } catch (error) {
        userInterestsDiv.innerHTML = `<div class="empty-state">Error: ${error.message}</div>`;
    }
}

async function loadMyInterestsCheck() {
    const descEl = document.getElementById('checkInterestsDescription');
    if (!isAuthenticated) {
        document.getElementById('myInterestsSection').style.display = 'none';
        document.getElementById('checkInterestsSection').style.display = 'block';
        document.getElementById('myInterestsAuth').style.display = 'block';
        document.getElementById('myInterestsContent').style.display = 'none';
        if (descEl) {
            descEl.textContent = 'View and manage your interests or view another user\'s interests. Log in for easier management and additional features.';
        }
        return;
    }
    
    document.getElementById('myInterestsSection').style.display = 'block';
    document.getElementById('checkInterestsSection').style.display = 'none';
    if (descEl) {
        descEl.textContent = 'View interests for any Bluesky user';
    }
    
    try {
        const response = await fetch('/api/interests/my', {
            credentials: 'same-origin'
        });
        const data = await response.json();
        
        const interests = data || [];
        document.getElementById('myInterestCountCheck').textContent = interests.length;
        document.getElementById('myInterestsAuth').style.display = 'none';
        document.getElementById('myInterestsContent').style.display = 'block';
        
        const list = document.getElementById('myInterestsListCheck');
        if (interests.length === 0) {
            list.innerHTML = '<div class="empty-state">No interests yet. Browse interests and click "Add".</div>';
        } else {
            list.innerHTML = interests.map(interest => {
                return `
                    <div class="user-label">
                        <div>
                            <h4>${interest.name}</h4>
                            <span class="location-key">${interest.key}</span>
                        </div>
                        <button class="btn-sm btn-secondary" onclick="removeInterestFromCheck('${interest.key}', '${interest.name}')">Remove</button>
                    </div>
                `;
            }).join('');
        }
    } catch (error) {
        console.error('Failed to load interests:', error);
    }
}

async function removeInterestFromCheck(key, name) {
    if (!confirm(`Remove "${name}" interest?`)) return;
    
    try {
        const response = await fetch('/api/interests/remove', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ interestKey: key })
        });
        
        const data = await response.json();
        
        if (data.success) {
            alert(`Removed "${name}" interest!`);
            loadMyInterestsCheck();
            // Also reload the main interests page if it exists
            if (typeof loadMyInterests === 'function') {
                loadMyInterests();
            }
        } else {
            alert('Error: ' + data.error);
        }
    } catch (error) {
        alert('Failed to remove interest');
    }
}

function openBlueskyRemoveInterest(key) {
    const handle = window.BLUESKY_HANDLE || 'atls.city';
    const command = `@${handle} !interest remove ${key}`;
    const url = `https://bsky.app/intent/compose?text=${encodeURIComponent(command)}`;
    window.open(url, '_blank');
}
</script>
