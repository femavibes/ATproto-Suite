<script>
(async function loadUserCount() {
  try {
    const response = await fetch('/api/user-count');
    const data = await response.json();
    document.getElementById('userCount').textContent = `${data.totalUsers.toLocaleString()} users mapped`;
  } catch (error) {
    console.error('Error loading user count:', error);
    document.getElementById('userCount').textContent = '';
  }
})();

function openUserGrowthModal() {
  const modal = document.getElementById('userGrowthModal');
  modal.classList.add('active');
  loadUserGrowthChart();
}

function closeUserGrowthModal() {
  const modal = document.getElementById('userGrowthModal');
  modal.classList.remove('active');
}

// Close modal when clicking outside
document.addEventListener('click', function(e) {
  const modal = document.getElementById('userGrowthModal');
  if (modal && e.target === modal) {
    closeUserGrowthModal();
  }
});

async function loadUserGrowthChart() {
  try {
    const response = await fetch('/api/user-growth');
    const data = await response.json();
    
    // Calculate cumulative totals
    let cumulative = 0;
    const chartData = data.growth.map(item => {
      cumulative += parseInt(item.new_users);
      return {
        date: new Date(item.date),
        total: cumulative
      };
    });
    
    // Create simple chart using canvas
    const container = document.getElementById('userGrowthChart');
    container.innerHTML = '<canvas id="growthCanvas"></canvas>';
    const canvas = document.getElementById('growthCanvas');
    const ctx = canvas.getContext('2d');
    
    // Set canvas size
    canvas.width = container.offsetWidth;
    canvas.height = 400;
    
    const padding = 50;
    const chartWidth = canvas.width - padding * 2;
    const chartHeight = canvas.height - padding * 2;
    
    // Find max value
    const maxValue = Math.max(...chartData.map(d => d.total));
    
    // Draw axes
    ctx.strokeStyle = '#d4d4d4';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padding, padding);
    ctx.lineTo(padding, canvas.height - padding);
    ctx.lineTo(canvas.width - padding, canvas.height - padding);
    ctx.stroke();
    
    // Draw line
    ctx.strokeStyle = '#22c55e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    
    chartData.forEach((point, i) => {
      const x = padding + (i / (chartData.length - 1)) * chartWidth;
      const y = canvas.height - padding - (point.total / maxValue) * chartHeight;
      
      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    });
    
    ctx.stroke();
    
    // Draw labels
    ctx.fillStyle = '#737373';
    ctx.font = '12px Inter';
    ctx.textAlign = 'center';
    
    // X-axis labels (dates)
    const labelInterval = Math.ceil(chartData.length / 5);
    chartData.forEach((point, i) => {
      if (i % labelInterval === 0 || i === chartData.length - 1) {
        const x = padding + (i / (chartData.length - 1)) * chartWidth;
        const dateStr = point.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        ctx.fillText(dateStr, x, canvas.height - padding + 20);
      }
    });
    
    // Y-axis labels (user counts)
    ctx.textAlign = 'right';
    for (let i = 0; i <= 5; i++) {
      const value = Math.round((maxValue / 5) * i);
      const y = canvas.height - padding - (i / 5) * chartHeight;
      ctx.fillText(value.toLocaleString(), padding - 10, y + 4);
    }
    
    // Title
    ctx.fillStyle = '#171717';
    ctx.font = 'bold 14px Inter';
    ctx.textAlign = 'center';
    ctx.fillText('Total Users Over Time', canvas.width / 2, 20);
    
  } catch (error) {
    console.error('Error loading user growth chart:', error);
    document.getElementById('userGrowthChart').innerHTML = '<p style="text-align: center; color: #737373; padding: 2rem;">Failed to load chart</p>';
  }
}
</script>
