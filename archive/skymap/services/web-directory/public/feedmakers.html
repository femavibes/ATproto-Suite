        loadInterestFeeds();
        window.interestsLoaded = true;
    }
}

async function loadInterestFeeds() {
    const [interestsRes, categoriesRes] = await Promise.all([
        fetch('/api/interests/public'),
        fetch('/api/interests/categories')
    ]);
    
    const interests = await interestsRes.json();
    const categories = await categoriesRes.json();
    
    const categoryFilter = document.getElementById('interestCategoryFilter');
    categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat.id;
        option.textContent = cat.name;
        categoryFilter.appendChild(option);
    });
    
    window.allInterestFeeds = interests;
    displayInterestFeeds();
}

function displayInterestFeeds() {
    const search = document.getElementById('interestFeedSearch').value.toLowerCase();
    const categoryId = document.getElementById('interestCategoryFilter').value;
    
    const filtered = window.allInterestFeeds.filter(i => {
        const matchesSearch = !search || i.name.toLowerCase().includes(search) || (i.description && i.description.toLowerCase().includes(search));
        const matchesCategory = !categoryId || i.category_id == categoryId;
        return matchesSearch && matchesCategory;
    });
    
    const results = document.getElementById('interestFeedResults');
    
    if (filtered.length === 0) {
        results.innerHTML = '<div class="empty-state">No interests found</div>';
        return;
    }
    
    results.innerHTML = filtered.map(interest => {
        const userCount = parseInt(interest.user_count) || 0;
        const memberText = userCount === 1 ? '1 user' : `${userCount} users`;
        const listUri = `at://did:web:lists.fema.monster/app.bsky.graph.list/${interest.key}`;
        
        return `

async function resolveProfiles(dids) {
    if (dids.length === 0) return [];
    
    const CACHE_KEY = 'skymap_profiles';
    const CACHE_DURATION = 60 * 60 * 1000;
    const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
    const now = Date.now();
    
    const profiles = [];
    const uncachedDids = [];
    
    for (const did of dids) {
        const cached = cache[did];
        if (cached && now - cached.timestamp < CACHE_DURATION) {
            profiles.push(cached.profile);
        } else {
            uncachedDids.push(did);
        }
    }
    
    if (uncachedDids.length > 0) {
        const batchSize = 25;
        for (let i = 0; i < uncachedDids.length; i += batchSize) {
            const batch = uncachedDids.slice(i, i + batchSize);
            const params = batch.map(did => `actors=${encodeURIComponent(did)}`).join('&');
            const response = await fetch(`https://public.api.bsky.app/xrpc/app.bsky.actor.getProfiles?${params}`);
            const data = await response.json();
            
            if (data.profiles) {
                for (const profile of data.profiles) {
                    cache[profile.did] = { profile, timestamp: now };
                    profiles.push(profile);
                }
            }
        }
        localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
    }
    
    return profiles;
}

function copyModalUri(e) {
    const listUri = `at://did:web:lists.fema.monster/app.bsky.graph.list/${window.currentLocationKey}`;

        const btn = e.target.closest('button');
        const span = btn.querySelector('span');
        const originalText = span.textContent;
        span.textContent = '✓';
        setTimeout(() => span.textContent = originalText, 1000);
    });
}

function copyModalWebUrl(e) {
    const webUrl = `https://skymap.fema.monster/list/${window.currentLocationKey}`;
    navigator.clipboard.writeText(webUrl).then(() => {
        const btn = e.target.closest('button');
        const span = btn.querySelector('span');
        const originalText = span.textContent;
        span.textContent = '✓';
        setTimeout(() => span.textContent = originalText, 1000);
    });
}

                const filtered = window.allModalProfiles.filter(profile => 
                    profile.handle.toLowerCase().includes(query) ||
                    (profile.displayName && profile.displayName.toLowerCase().includes(query))
                );
                displayModalProfiles(filtered);
            }
        });
    }
});

function copyListUri(uri, event) {
    const button = event.currentTarget;
    if (!button) return;
    const originalHTML = button.innerHTML;
    
    navigator.clipboard.writeText(uri).then(() => {
        button.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        setTimeout(() => {
            button.innerHTML = originalHTML;
        }, 1000);
    });
}

function openCustomNodesModal(nodeIds, regionName) {
    const modal = document.getElementById('customNodesModal');
    if (!modal) {
        const modalHtml = `
            <div id="customNodesModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); z-index: 10000; align-items: center; justify-content: center;">
                <div class="modal-content" style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-radius: 16px; padding: 1.5rem; max-width: 400px; width: 90%; max-height: 90vh; overflow-y: auto; position: relative;">
                    <button onclick="closeCustomNodesModal()" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; color: #737373; cursor: pointer; padding: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.1)'" onmouseout="this.style.background='none'">&times;</button>
                    <h3 id="customNodesModalTitle" style="margin: 0 0 1rem 0; font-size: 1.125rem; font-weight: 600;"></h3>
                    <div id="customNodesModalContent"></div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        document.getElementById('customNodesModal').addEventListener('click', (e) => {
            if (e.target.id === 'customNodesModal') closeCustomNodesModal();
        });
    }
    
    const title = document.getElementById('customNodesModalTitle');
    const content = document.getElementById('customNodesModalContent');
    
    title.textContent = `${regionName} Custom Nodes`;
    content.innerHTML = nodeIds.map((id, idx) => {
        const startCity = idx * 50 + 1;
        const endCity = (idx + 1) * 50;
        return `
            <a href="https://www.graze.social/custom-nodes/${id}" target="_blank" style="display: flex; align-items: center; justify-content: space-between; padding: 0.75rem; margin-bottom: 0.5rem; background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 8px; text-decoration: none; color: inherit; transition: background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='rgba(255,255,255,0.9)'">
                <div>
                    <div style="font-weight: 500;">Node ${idx + 1}</div>
                    <div style="font-size: 0.875rem; color: #737373;">Cities ${startCity}-${endCity}</div>
                </div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </a>
        `;
    }).join('');
    
    document.getElementById('customNodesModal').style.display = 'flex';
}

function closeCustomNodesModal() {
    const modal = document.getElementById('customNodesModal');
    if (modal) modal.style.display = 'none';
}

function closeListsModal() {
    document.getElementById('listsModal').classList.remove('active');
    history.pushState({}, '', '/');
}

window.addEventListener('popstate', (event) => {
    if (event.state && event.state.locationKey) {
        const locationKey = event.state.locationKey;
        openMembersModal(locationKey, locationKey);
    } else {
        const modal = document.getElementById('listsModal');
        if (modal && modal.classList.contains('active')) {
            modal.classList.remove('active');
        }
    }
});

document.getElementById('feedCountryFilter').addEventListener('change', (e) => {
    loadFeedRegions(e.target.value);
    searchFeeds();
});
document.getElementById('feedRegionFilter').addEventListener('change', searchFeeds);
document.getElementById('feedLocationTypeFilter').addEventListener('change', searchFeeds);
document.getElementById('feedSearchInput').addEventListener('input', () => {
    clearTimeout(feedSearchTimeout);
    feedSearchTimeout = setTimeout(searchFeeds, 300);
});

loadFeedCountries();
loadFeedRegions();
searchFeeds();
</script>
