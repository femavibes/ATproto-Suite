<!DOCTYPE html>
<html>
<head>
    <title>Icon Comparison</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/styles.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            padding: 2rem;
            background: linear-gradient(135deg, #e0f2e9 0%, #88d9b8 100%);
            min-height: 100vh;
        }
        .comparison {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 3rem;
            color: #171717;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .option {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
        }
        .header-preview {
            font-size: 2.5rem;
            font-weight: 600;
            color: #171717;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .header-preview img {
            width: 2.5rem;
            height: 2.5rem;
        }
        .option h3 {
            margin-top: 1rem;
            color: #525252;
        }
        .note {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            color: #525252;
        }
        button {
            padding: 0.875rem 1.5rem;
            background: rgba(23, 23, 23, 0.9);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover {
            background: rgba(64, 64, 64, 0.9);
        }
    </style>
</head>
<body>
    <div class="comparison">
        <h1>Choose Your Icon</h1>
        
        <div class="options">
            <div class="option">
                <div class="header-preview">
                    <img src="ATlas [Transparent].png" alt="ATlas" />
                    ATlas
                </div>
                <h3>Option 1: Transparent</h3>
                <button onclick="selectOption(1)">Use This One</button>
            </div>
            
            <div class="option">
                <div class="header-preview">
                    <img src="ATlas [Transparent - Black Outline].png" alt="ATlas" />
                    ATlas
                </div>
                <h3>Option 2: Black Outline</h3>
                <button onclick="selectOption(2)">Use This One</button>
            </div>
        </div>
        
        <div class="note">
            <p><strong>Currently using:</strong> Option 1 (Transparent)</p>
            <p style="margin-top: 0.5rem; font-size: 0.875rem;">Click a button above to switch to that icon</p>
        </div>
    </div>
    
    <script>
        function selectOption(option) {
            const filename = option === 1 
                ? 'ATlas [Transparent].png' 
                : 'ATlas [Transparent - Black Outline].png';
            
            alert(`Switching to Option ${option}...\n\nYou'll need to update header.html to use:\n${filename}`);
        }
    </script>
</body>
</html>
