# @NOTE: this compose file is intended to accompany the guide found in HOSTING.md
#
# Caddy was removed from this stack: the host already runs nginx on :80/:443
# (see /ATlas/nginx/*.conf). Ozone listens on localhost:3000; nginx terminates
# TLS and reverse-proxies to it (e.g. ozone.atls.city, ozoneskymap.fema.monster).
# A second edge proxy in Docker with network_mode: host cannot bind 80/443.
version: '3.9'
services:
  ozone:
    container_name: ozone
    image: ghcr.io/bluesky-social/ozone:0.1
    network_mode: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - /ATlas/ozone/ozone.env
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
  postgres:
    container_name: postgres
    image: postgres:14.11-bookworm
    command: postgres -c listen_addresses=localhost
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: pg_isready -h localhost -U $$POSTGRES_USER
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - type: bind
        source: /ATlas/ozone/postgres
        target: /var/lib/postgresql/data
    env_file:
      - /ATlas/ozone/postgres.env
  watchtower:
    container_name: watchtower
    # we're using a fork of watchtower, as containrrr/watchtower hasn't been
    # updated in 2 years and is incompatible with latest docker on debian:
    image: nickfedor/watchtower:latest
    network_mode: host
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: true
      WATCHTOWER_SCHEDULE: '@midnight'
      WATCHTOWER_LABEL_ENABLE: true
