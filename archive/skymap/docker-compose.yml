  #     - PORT=3009
  #   depends_on:
  #     - postgres
  #   network_mode: host
  #   restart: unless-stopped
  #   volumes:
  #     - ./data:/app/data
  #     - ./services/data-parser:/data-parser
  #     - /var/run/docker.sock:/var/run/docker.sock

  web-directory:
    build:
      context: ./services/web-directory
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://dev:devpass@localhost:5435/skymap
      - LABELER_DID=${LABELER_DID}
      - BLUESKY_HANDLE=${BLUESKY_HANDLE}
      - BLUESKY_PASSWORD=${BLUESKY_PASSWORD}
      - IMGBB_API_KEY=${IMGBB_API_KEY}
      - BASE_URL=${BASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_URL=${ADMIN_URL}
      - APP_NAME=${APP_NAME}
      - PORT=3008
      - DISCORD_WEBHOOK_ALERTS=${DISCORD_WEBHOOK_ALERTS}
      - DISCORD_WEBHOOK_USERS=${DISCORD_WEBHOOK_USERS}
      - DISCORD_WEBHOOK_ERRORS=${DISCORD_WEBHOOK_ERRORS}
    depends_on:
      - postgres
    network_mode: host
    restart: unless-stopped

  command-bot:
    build:
      context: ./services/command-bot
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://dev:devpass@localhost:5435/skymap
      - BLUESKY_HANDLE=${BLUESKY_HANDLE}
      - BLUESKY_PASSWORD=${BLUESKY_PASSWORD}
      - LABELER_DID=${LABELER_DID}
      - OZONE_URL=http://localhost:3000
      - OZONE_ADMIN_PASSWORD=208022ff959105c20d4c76269206eeb6
      - DISCORD_WEBHOOK_USERS=${DISCORD_WEBHOOK_USERS}
    depends_on:
      - postgres
    network_mode: host
    restart: unless-stopped


  atproto-proxy:
    build:
      context: ./services/atproto-proxy
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://dev:devpass@localhost:5435/skymap
      - PORT=3010
    depends_on:
      - postgres
    network_mode: host
    restart: unless-stopped

  backup-service:
    build:
      context: ./services/backup-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - SKYMAP_HOST=localhost
      - SKYMAP_PORT=5435
      - SKYMAP_DB=skymap
      - SKYMAP_USER=dev
      - SKYMAP_PASSWORD=devpass
      - OZONE_HOST=localhost
      - OZONE_PORT=5432
      - OZONE_DB=ozone
      - OZONE_USER=postgres
      - OZONE_PASSWORD=${OZONE_POSTGRES_PASSWORD:-08b5407640c8bf0275895a3707809e8d}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      - GOOGLE_APPLICATION_CREDENTIALS=/gcs-credentials.json
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
      - BACKUP_RETENTION_DAILY=${BACKUP_RETENTION_DAILY:-7}
      - BACKUP_RETENTION_WEEKLY=${BACKUP_RETENTION_WEEKLY:-4}
      - BACKUP_RETENTION_MONTHLY=${BACKUP_RETENTION_MONTHLY:-3}
    network_mode: host
    volumes:
      - ./gcs-credentials.json:/gcs-credentials.json:ro
      - backup_logs:/var/log/backups
    restart: unless-stopped

  moderation-checker:
    build:
      context: ./services/moderation-checker
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://dev:devpass@localhost:5435/skymap
    depends_on:
      - postgres
    network_mode: host
    restart: unless-stopped

volumes:
  postgres_data:
  backup_logs: