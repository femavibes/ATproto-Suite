services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: skymap
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
    network_mode: host
    command: postgres -c port=5435
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # admin: RETIRED - migrated to unified admin at /home/ubuntu/Near-You (PM2: near-you-admin, port 4001)
  #   build:
  #     context: ./services/admin
  #     dockerfile: Dockerfile
  #   env_file:
  #     - .env
  #   environment:
  #     - DATABASE_URL=postgresql://dev:devpass@localhost:5435/skymap
  #     - IMGBB_API_KEY=${IMGBB_API_KEY}
  #     - BASE_URL=${BASE_URL}
