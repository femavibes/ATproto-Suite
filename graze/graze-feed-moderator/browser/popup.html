<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e1e8ed;
    }
    
    .header h1 {
      margin: 0 0 0 8px;
      font-size: 18px;
      font-weight: 600;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      font-size: 14px;
    }
    
    .form-group input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #1d9bf0;
      box-shadow: 0 0 0 3px rgba(29, 155, 240, 0.1);
    }
    
    .button {
      background: #1d9bf0;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      width: 100%;
    }
    
    .button:hover {
      background: #1a8cd8;
    }
    
    .button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    
    .status {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
    }
    
    .status.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    
    .status.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    
    .status.info {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #93c5fd;
    }
    
    .user-info {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    
    .user-info strong {
      color: #1d9bf0;
    }
    
    .help-text {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">🛡️</span>
    <h1>ModMaster</h1>
  </div>
  
  <div id="userInfo" class="user-info" style="display: none;">
    <div><strong>Connected:</strong> <span id="userHandle"></span></div>
    <div><strong>Feeds:</strong> <span id="feedCount"></span></div>
  </div>
  
  <div class="form-group">
    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="fm_live_...">
    <div class="help-text">Get your API key from Settings → API Keys in the ModMaster web app</div>
  </div>
  
  <div class="form-group">
    <label for="apiUrl">API URL</label>
    <input type="url" id="apiUrl" value="https://modmaster.fema.monster">
    <div class="help-text">Your ModMaster instance URL</div>
  </div>
  
  <div class="form-group">
    <label>
      <input type="checkbox" id="dryRunMode"> Dry Run Mode
    </label>
    <div class="help-text">When enabled, shows API calls instead of executing them</div>
  </div>
  
  <button id="saveBtn" class="button">Save Settings</button>
  <button id="testBtn" class="button" style="margin-top: 8px; background: #10b981;">Test Connection</button>
  <button id="updateBtn" class="button" style="margin-top: 8px; background: #f59e0b;">Check for Updates</button>
  
  <div id="status" class="status" style="display: none;"></div>
  
  <script src="popup.js"></script>
</body>
</html>
