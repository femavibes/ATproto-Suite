services:
  daily-content-bot:
    build: .
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./.env:/app/.env
    restart: unless-stopped
    user: root
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000